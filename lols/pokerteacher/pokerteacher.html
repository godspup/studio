<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Покер за 5 минут</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#000;color:#e8e8e8;touch-action:none}
  #scene{display:block;width:100vw;height:100vh;touch-action:none}

  #progressTrack{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(0,0,0,.6);z-index:50;pointer-events:none}
  #progressFill{height:100%;background:linear-gradient(90deg,#ffd76a,#ffa030);width:0%;transition:width .5s;box-shadow:0 0 10px #ffd76a}
  #stepLabel{position:fixed;top:10px;right:16px;font-size:11px;color:#ffd76a;letter-spacing:2px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.9);z-index:50;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:12px;pointer-events:none}

  #whatsHappening{
    position:fixed;top:44px;right:14px;
    padding:8px 14px;
    background:linear-gradient(180deg,rgba(40,60,45,.92),rgba(20,30,20,.95));
    border:1.5px solid rgba(255,215,120,.6);border-radius:10px;
    color:#ffd76a;font-size:11px;font-weight:800;
    letter-spacing:1.2px;text-transform:uppercase;
    cursor:pointer;font-family:inherit;z-index:55;
    box-shadow:0 6px 20px rgba(0,0,0,.6);
    display:none;align-items:center;gap:6px;
    transition:all .2s;
  }
  #whatsHappening.visible{display:flex}
  #whatsHappening:hover{transform:translateY(-1px);border-color:rgba(255,215,120,1)}
  #whatsHappening::before{content:'?';display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#ffd76a;color:#1a1a1a;font-size:11px;font-weight:900}

  #whatsHappeningPanel{
    position:fixed;top:90px;right:14px;width:min(280px,calc(100vw - 28px));
    background:linear-gradient(180deg,rgba(15,22,15,.98),rgba(8,12,8,.99));
    border:1.5px solid #ffd76a;border-radius:12px;
    padding:14px;z-index:56;
    box-shadow:0 20px 60px rgba(0,0,0,.85);
    display:none;
    animation:slideDown .25s;
  }
  @keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  #whatsHappeningPanel.visible{display:block}
  #whatsHappeningPanel h4{font-family:Georgia,serif;font-size:14px;color:#ffd76a;margin-bottom:8px;letter-spacing:.5px}
  #whatsHappeningPanel p{font-size:12.5px;line-height:1.55;color:#d8e0d8}
  #whatsHappeningPanel .close-mini{
    position:absolute;top:8px;right:10px;
    background:none;border:none;color:#ffd76a;font-size:16px;cursor:pointer;
    font-family:inherit;
  }

  #brainrotBtn{
    position:fixed;top:44px;left:14px;
    padding:7px 12px;
    background:linear-gradient(180deg,rgba(60,20,60,.92),rgba(30,10,30,.95));
    border:1.5px solid rgba(255,120,255,.6);border-radius:10px;
    color:#ff8aff;font-size:11px;font-weight:800;
    letter-spacing:.8px;text-transform:uppercase;
    cursor:pointer;font-family:inherit;z-index:55;
    box-shadow:0 6px 20px rgba(0,0,0,.6);
    transition:all .2s;
    max-width:190px;line-height:1.3;text-align:left;
  }
  #brainrotBtn:hover{transform:translateY(-1px);border-color:#ff8aff}

  #banner{
    position:fixed;top:80px;left:50%;transform:translateX(-50%);
    padding:6px 18px;background:rgba(0,0,0,.82);
    border:1px solid rgba(255,215,120,.6);border-radius:20px;
    color:#ffd76a;font-size:12px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;opacity:0;transition:opacity .3s;
    z-index:30;pointer-events:none;white-space:nowrap;
    box-shadow:0 6px 24px rgba(0,0,0,.7),0 0 20px rgba(255,215,120,.25);
  }
  #banner.active{opacity:1}

  #tutorial{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(180deg,rgba(12,16,12,.82) 0%,rgba(6,10,6,.97) 40%,rgba(4,6,4,.99) 100%);
    border-top:1px solid rgba(255,215,120,.3);
    padding:12px 14px 14px;
    z-index:20;backdrop-filter:blur(12px);
    box-shadow:0 -12px 40px rgba(0,0,0,.8);
    max-height:36vh;overflow-y:auto;
    animation:slideUp .35s cubic-bezier(.2,.8,.3,1);
  }
  #tutorial::-webkit-scrollbar{width:3px}
  #tutorial::-webkit-scrollbar-thumb{background:rgba(255,215,120,.4);border-radius:2px}
  @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  #tutTitle{font-family:Georgia,serif;font-size:16px;color:#ffd76a;letter-spacing:.3px;margin-bottom:6px;line-height:1.2;text-shadow:0 0 20px rgba(255,215,120,.35)}
  #tutText{font-size:13.5px;line-height:1.55;color:#dde4dd;margin-bottom:10px}
  #tutText b{color:#fff}
  #tutText em{color:#ffd76a;font-style:normal;font-weight:600}

  .term{color:#ffd76a;border-bottom:1px dashed rgba(255,215,120,.7);cursor:pointer;padding:0 1px;transition:all .15s;font-weight:600;white-space:nowrap}
  .term:active,.term:hover{color:#fff;background:rgba(255,215,120,.25);border-radius:3px;padding:0 4px}

  #tutNav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #choices{display:none;gap:8px;margin-top:10px;flex-wrap:wrap}
  #choices.active{display:flex}
  .choice{
    flex:1;min-width:120px;
    padding:11px 12px;
    background:linear-gradient(180deg,rgba(40,55,40,.9),rgba(20,28,20,.95));
    border:1.5px solid rgba(255,215,120,.35);
    border-radius:10px;color:#e8e8e8;font-size:13px;font-weight:600;
    cursor:pointer;text-align:center;font-family:inherit;
    transition:all .2s;line-height:1.3;
  }
  .choice:hover:not(:disabled){border-color:rgba(255,215,120,.9);transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,215,120,.25)}
  .choice:disabled{cursor:default}
  .choice.correct{background:linear-gradient(180deg,rgba(40,140,55,.95),rgba(20,70,25,.95));border-color:#4cd060;color:#fff;animation:pulseGood .5s}
  .choice.wrong{background:linear-gradient(180deg,rgba(140,45,45,.95),rgba(70,20,20,.95));border-color:#e05050;color:#fff}
  @keyframes pulseGood{0%,100%{transform:scale(1)}50%{transform:scale(1.05);box-shadow:0 0 30px rgba(76,208,96,.7)}}
  .feedback-block{flex-basis:100%;margin-top:8px;padding:10px 13px;background:rgba(255,215,120,.1);border-left:3px solid #ffd76a;border-radius:6px;font-size:12.5px;line-height:1.55;color:#dde4dd}

  .btn{padding:10px 22px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .15s;border:none;white-space:nowrap}
  .btn-primary{background:linear-gradient(180deg,#ffd76a,#c89830);color:#1a1a1a;box-shadow:0 4px 16px rgba(255,215,120,.4)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,215,120,.55)}
  .btn-primary:active{transform:scale(.97)}
  .btn-ghost{background:transparent;color:#ffd76a;border:1.5px solid rgba(255,215,120,.5)}
  .btn-ghost:active{background:rgba(255,215,120,.15)}

  .rank-list{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .rank-item{display:flex;align-items:center;gap:10px;padding:7px 10px;background:linear-gradient(180deg,rgba(30,45,30,.7),rgba(15,22,15,.85));border:1px solid rgba(255,215,120,.15);border-radius:8px}
  .rank-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#ffd76a,#c89830);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex-shrink:0}
  .rank-item.top .rank-num{background:linear-gradient(180deg,#ff5555,#a02020);color:#fff}
  .rank-info{flex:1;min-width:0}
  .rank-name{font-size:12.5px;font-weight:700;color:#fff;margin-bottom:1px}
  .rank-desc{font-size:10.5px;color:#8a9a8a}
  .rank-cards{display:flex;gap:2px;flex-shrink:0}
  .mini-card{width:19px;height:26px;background:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#1a1a1a;box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .mini-card.red{color:#c9261a}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  .action{padding:9px 11px;background:linear-gradient(180deg,rgba(30,45,30,.7),rgba(15,22,15,.85));border:1px solid rgba(255,215,120,.2);border-radius:8px}
  .action-name{font-size:12.5px;font-weight:700;color:#ffd76a;margin-bottom:2px}
  .action-desc{font-size:11px;color:#c8d0c8;line-height:1.35}

  .tip{display:flex;gap:10px;padding:8px 11px;margin-bottom:5px;background:linear-gradient(180deg,rgba(30,45,30,.6),rgba(15,22,15,.75));border-left:3px solid #ffd76a;border-radius:6px}
  .tip-num{color:#ffd76a;font-weight:900;font-size:16px;flex-shrink:0}
  .tip-text{font-size:12px;color:#d8e0d8;line-height:1.45}

  #termPopup{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);padding:18px}
  #termPopup.active{display:flex;animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .term-card{width:min(420px,100%);background:linear-gradient(180deg,#1a2820,#0f1813);border:2px solid #ffd76a;border-radius:14px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.95),0 0 40px rgba(255,215,106,.3);animation:popIn .3s cubic-bezier(.2,.8,.3,1.2);max-height:85vh;overflow-y:auto}
  @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .term-card-title{font-family:Georgia,serif;font-size:20px;color:#ffd76a;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .term-card-close{width:28px;height:28px;border-radius:50%;background:rgba(255,215,120,.15);border:1px solid rgba(255,215,120,.4);color:#ffd76a;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;flex-shrink:0}
  .term-card-body{font-size:14px;line-height:1.6;color:#dde4dd}
  .term-card-body em{color:#ffd76a;font-style:normal;font-weight:600}
  .term-card-example{margin-top:12px;padding:10px 12px;background:rgba(255,215,120,.08);border-left:3px solid #ffd76a;border-radius:6px;font-size:12.5px;color:#c8d0c8;line-height:1.5}
  .term-card-example b{color:#ffd76a}

  #quiz{position:fixed;inset:0;z-index:80;display:none;background:radial-gradient(ellipse at center,#0f1a12,#050a06);padding:16px;overflow-y:auto;flex-direction:column;align-items:center;justify-content:flex-start}
  #quiz.active{display:flex}
  .quiz-inner{width:min(540px,100%);margin:auto 0;padding:12px}
  .quiz-header{text-align:center;margin-bottom:14px}
  .quiz-header h2{font-family:Georgia,serif;font-size:22px;color:#ffd76a;margin-bottom:4px}
  .quiz-header .prog{font-size:11px;color:#8a9a8a;letter-spacing:2px}
  .quiz-scenario{padding:14px;margin-bottom:10px;background:linear-gradient(180deg,rgba(30,50,35,.7),rgba(15,25,20,.85));border:1px solid rgba(255,215,120,.3);border-radius:12px}
  .quiz-scenario-label{font-size:10px;color:#8a9a8a;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}
  .quiz-cards{display:flex;gap:5px;justify-content:center;margin:8px 0;flex-wrap:wrap}
  .qCard{width:44px;height:62px;background:linear-gradient(180deg,#fff,#f0f0f0);border-radius:5px;display:flex;flex-direction:column;justify-content:space-between;padding:3px;color:#1a1a1a;font-weight:900;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .qCard.red{color:#c9261a}
  .qCard .bc-bottom{transform:rotate(180deg);align-self:flex-end;font-size:9px;opacity:.7}
  .quiz-question{font-size:14px;color:#e8e8e8;margin:8px 0;line-height:1.5;font-weight:500;text-align:center}
  .quiz-options{display:flex;flex-direction:column;gap:7px}
  .qOpt{padding:12px 15px;background:linear-gradient(180deg,rgba(30,50,35,.85),rgba(15,25,20,.9));border:1.5px solid rgba(255,215,120,.3);border-radius:10px;color:#d8e0d8;font-size:13px;font-weight:600;cursor:pointer;text-align:left;font-family:inherit;transition:all .2s;line-height:1.4}
  .qOpt:hover:not(:disabled){border-color:rgba(255,215,120,.8);transform:translateX(3px)}
  .qOpt:disabled{cursor:default}
  .qOpt.correct{background:linear-gradient(180deg,rgba(40,140,55,.9),rgba(20,70,25,.9));border-color:#4cd060;color:#fff}
  .qOpt.wrong{background:linear-gradient(180deg,rgba(140,45,45,.9),rgba(70,20,20,.9));border-color:#e05050;color:#fff}
  .qOpt .term{color:#ffe8a0}
  .quiz-feedback{margin-top:10px;padding:12px;background:rgba(255,215,120,.08);border-radius:10px;font-size:12.5px;line-height:1.55;color:#d8ded8;border-left:3px solid #ffd76a}
  .quiz-feedback b{color:#ffd76a}
  .quiz-result{text-align:center;padding:20px 14px}
  .quiz-result .score{font-family:Georgia,serif;font-size:54px;color:#ffd76a;line-height:1;margin-bottom:8px;text-shadow:0 0 40px rgba(255,215,106,.5)}
  .quiz-result .score-label{font-size:11px;color:#8a9a8a;letter-spacing:2px;margin-bottom:16px}
  .quiz-result .verdict{font-size:15px;color:#e8e8e8;margin-bottom:16px;line-height:1.5}
  .quiz-restart{padding:12px 26px;background:linear-gradient(180deg,#ffd76a,#a88830);color:#1a1a1a;border:none;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(255,215,120,.4)}

  @media (max-width:500px){
    #tutorial{padding:10px 12px;max-height:42vh}
    #tutTitle{font-size:15px}
    #tutText{font-size:12.5px}
    .choice{padding:9px 10px;font-size:12px;min-width:80px}
    .btn{padding:9px 16px;font-size:12px}
    #brainrotBtn{font-size:10px;max-width:150px;padding:6px 10px}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="progressTrack"><div id="progressFill"></div></div>
<div id="stepLabel">1 / 10</div>
<div id="banner"></div>

<button id="brainrotBtn">🧠 Брейнрот 1/3 · тап для переключения</button>

<button id="whatsHappening">Что происходит</button>
<div id="whatsHappeningPanel">
  <button class="close-mini" onclick="document.getElementById('whatsHappeningPanel').classList.remove('visible')">✕</button>
  <h4 id="whTitle">Состояние стола</h4>
  <p id="whText"></p>
</div>

<div id="tutorial">
  <div id="tutTitle"></div>
  <div id="tutText"></div>
  <div id="choices"></div>
  <div id="tutNav">
    <button class="btn btn-ghost" id="backBtn">← Назад</button>
    <button class="btn btn-primary" id="nextBtn">Далее →</button>
  </div>
</div>

<div id="termPopup">
  <div class="term-card">
    <div class="term-card-title">
      <span id="termTitle"></span>
      <button class="term-card-close" onclick="closeTerm()">✕</button>
    </div>
    <div class="term-card-body" id="termBody"></div>
    <div class="term-card-example" id="termExample"></div>
  </div>
</div>

<div id="quiz"><div class="quiz-inner" id="quizInner"></div></div>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

// ═══════════════ TERMS ═══════════════
const TERMS = {
  'холдем': { title:'Техасский холдем', body:'Самый популярный вид покера. Ты получаешь <em>2 карты в закрытую</em>, на стол выкладывают <em>5 общих карт</em>. Из 7 карт собираешь лучшую пятёрку.', example:'<b>Пример:</b> у тебя A♠ K♠, на столе A♥ 7♦ 2♣ K♦ 5♠ — две пары (тузы и короли).' },
  'блайнд': { title:'Блайнд', body:'Обязательная ставка перед раздачей. Двое игроков слева от дилера кладут деньги в <em>банк</em>, чтобы был стартовый котёл.', example:'<b>Малый блайнд</b> = 1 фишка, <b>большой</b> = 2. Дальше все решают: продолжить или сбросить.' },
  'флоп': { title:'Флоп', body:'Первые <em>3 общие карты</em> на столе. После них — второй раунд ставок.', example:'У тебя A♠ K♠, флоп A♥ 7♦ 2♣ — попал в <b>топ-пару</b>.' },
  'тёрн': { title:'Тёрн', body:'<em>Четвёртая общая карта</em>. Приходит после ставок на флопе.', example:'На флопе A♥ 7♦ 2♣ у тебя пара тузов. На тёрне K♦ — уже <b>две пары</b>.' },
  'ривер': { title:'Ривер', body:'<em>Пятая и последняя общая карта</em>. После неё — последний раунд ставок.', example:'На ривере K♥ — у тебя <b>фулл-хаус</b>.' },
  'банк': { title:'Банк', body:'Общий «котёл» всех денег, которые поставили игроки. Победитель забирает весь банк.', example:'Если в банке 100 фишек и ты выиграл — забираешь все 100.' },
  'фолд': { title:'Фолд', body:'Сбросить карты. Ты выходишь из раздачи. Деньги, которые уже поставил, <em>остаются в банке</em>.', example:'Хороший игрок фолдит 70% слабых рук — это не слабость, а экономия.' },
  'чек': { title:'Чек', body:'Пропустить ход, не ставя денег. Можно только если <em>до тебя никто не поставил</em>.', example:'Если все чекают — банк не растёт, смотрим следующую карту бесплатно.' },
  'колл': { title:'Колл', body:'Уравнять ставку другого. Ты ставишь <em>столько же</em>, сколько поставили до тебя.', example:'Враг ставит 10 фишек, ты коллируешь — тоже 10. «Я в деле».' },
  'рейз': { title:'Рейз', body:'<em>Повысить ставку</em>. Ты ставишь больше предыдущего игрока. Сигнал: «у меня сильная рука».', example:'Враг ставит 10, ты рейзишь до 30. Он коллирует или фолдит — оба варианта выгодны.' },
  'олл-ин': { title:'Олл-ин', body:'Поставить <em>все свои фишки</em>. Либо максимально сильная рука, либо отчаянный блеф.', example:'Со стеком 500 фишек идёшь олл-ин — либо удвоишь, либо проиграешь всё.' },
  'префлоп': { title:'Префлоп', body:'Первый раунд ставок, когда у игроков только <em>2 карты на руках</em>, а общих карт ещё нет.', example:'Ты получаешь A♠ K♠ — это префлоп. Смотришь, рейзить или коллировать.' },
  'стартовая-рука': { title:'Стартовая рука', body:'2 карты, которые ты получаешь в начале раздачи. Видишь только ты. От силы руки зависит, играть или фолдить.', example:'<b>A♠ K♠</b> — премиум. <b>7♦ 2♣</b> — мусор, всегда фолд.' },
  'топ-пара': { title:'Топ-пара', body:'Пара с <em>самой старшей картой на столе</em>. Очень сильная рука.', example:'У тебя A♠ K♠, борд A♥ 7♦ 2♣ — топ-пара (тузы) с топ-кикером (король).' },
  'кикер': { title:'Кикер', body:'Пятая карта в комбинации. Если у двоих одинаковая пара, побеждает тот, у кого <em>кикер старше</em>.', example:'У тебя A♠ K♠, у врага A♦ Q♣. У обоих пара тузов, но твой K старше его Q.' },

const TV_W = 512, TV_H = 320;

// ─── CH 1: SPIRAL ───
const TV_CX = TV_W / 2;
const TV_CY = TV_H / 2;
const TV_RING_DEFS = [
  { r: 22,  n: 12, w: 5,   rotSpeed:  0.0009,  color: '#00ffff' },
  { r: 38,  n: 18, w: 5,   rotSpeed: -0.00085, color: '#00ff88' },
  { r: 56,  n: 24, w: 5.5, rotSpeed:  0.0008,  color: '#88ff00' },
  { r: 76,  n: 32, w: 6,   rotSpeed: -0.00075, color: '#ffaa00' },
  { r: 98,  n: 40, w: 6,   rotSpeed:  0.0007,  color: '#ff6600' },
  { r: 122, n: 50, w: 6.5, rotSpeed: -0.00065, color: '#ff3366' },
  { r: 148, n: 60, w: 7,   rotSpeed:  0.0006,  color: '#ff00aa' },
  { r: 176, n: 72, w: 7,   rotSpeed: -0.00055, color: '#bb00ff' },
  { r: 206, n: 84, w: 7.5, rotSpeed:  0.0005,  color: '#6699ff' },
];
const TV_GRAVITY = 0.085;
const TV_MAX_SPEED = 7.5;
const TV_MIN_SPEED = 4;
let tv1;

function initTV1(){
  tv1 = {
    rings: TV_RING_DEFS.map(def => ({
      ...def,
      angle: Math.random() * Math.PI * 2,
      gapIdx: Math.floor(Math.random() * def.n),
      tiles: Array.from({ length: def.n }, () => ({ active: true, respawnAt: 0 })),
    })),
    ball: { x: TV_CX, y: TV_CY, vx: 0, vy: 0, r: 4.2 },
    trail: [], particles: [],
    escaped: false, escapedAt: 0,
    startAt: performance.now(),
  };
  const a = Math.random() * Math.PI * 2;
  tv1.ball.vx = Math.cos(a) * 4;
  tv1.ball.vy = Math.sin(a) * 4 - 2;
}

function stepTV1Ball(s, now, dt){
  const ball = s.ball;
  const norm = Math.min(2, dt / 16.67);
  const steps = 4, sub = norm / steps;
  for (let k = 0; k < steps; k++){
    ball.vy += TV_GRAVITY * sub;
    const spNow = Math.hypot(ball.vx, ball.vy);
    if (spNow > TV_MAX_SPEED){ ball.vx *= TV_MAX_SPEED / spNow; ball.vy *= TV_MAX_SPEED / spNow; }
    ball.x += ball.vx * sub;
    ball.y += ball.vy * sub;
    const dx = ball.x - TV_CX, dy = ball.y - TV_CY;
    const dist = Math.hypot(dx, dy) || 0.001;
    const outerR = s.rings[s.rings.length - 1].r;
    if (dist > outerR + 60){ s.escaped = true; s.escapedAt = now; return; }
    for (const ring of s.rings){
      const halfW = ring.w / 2;
      const innerB = ring.r - halfW - ball.r;
      const outerB = ring.r + halfW + ball.r;
      if (dist <= innerB || dist >= outerB) continue;
      const ang = Math.atan2(dy, dx);
      let relAng = ang - ring.angle;
      relAng = ((relAng % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const arc = (Math.PI * 2) / ring.n;
      let idx = Math.floor(relAng / arc);
      if (idx < 0) idx = 0;
      if (idx >= ring.n) idx = ring.n - 1;
      if (idx === ring.gapIdx) continue;
      const tile = ring.tiles[idx];
      if (!tile.active) continue;
      const insideRing = dist < ring.r;
      const nx = dx / dist, ny = dy / dist;
      const vr = ball.vx * nx + ball.vy * ny;
      if (insideRing && vr <= 0) continue;
      if (!insideRing && vr >= 0) continue;
      tile.active = false;
      tile.respawnAt = now + 1600;
      for (let p = 0; p < 8; p++){
        const pa = Math.random() * Math.PI * 2;
        s.particles.push({
          x: ball.x, y: ball.y,
          vx: Math.cos(pa) * (1 + Math.random() * 3.5),
          vy: Math.sin(pa) * (1 + Math.random() * 3.5),
          life: 1, color: ring.color,
        });
      }
      ball.vx -= 2 * vr * nx; ball.vy -= 2 * vr * ny;
      const spAfter = Math.hypot(ball.vx, ball.vy) || 0.001;
      if (spAfter < TV_MIN_SPEED){ ball.vx *= TV_MIN_SPEED / spAfter; ball.vy *= TV_MIN_SPEED / spAfter; }
      const tangKick = (Math.random() - 0.5) * 2.8;
      ball.vx += -ny * tangKick; ball.vy += nx * tangKick;
      ball.vy -= 0.9;
      const spF = Math.hypot(ball.vx, ball.vy);
      if (spF > TV_MAX_SPEED){ ball.vx *= TV_MAX_SPEED / spF; ball.vy *= TV_MAX_SPEED / spF; }
      if (spF < TV_MIN_SPEED){ ball.vx *= TV_MIN_SPEED / spF; ball.vy *= TV_MIN_SPEED / spF; }
      const targetR = insideRing ? ring.r - halfW - ball.r - 0.5 : ring.r + halfW + ball.r + 0.5;
      ball.x = TV_CX + nx * targetR;
      ball.y = TV_CY + ny * targetR;
    }
  }
}

function updateTV1(now, dt){
  if (!tv1) initTV1();
  const s = tv1;
  for (const ring of s.rings) ring.angle += ring.rotSpeed * dt;
  if (s.escaped){ if (now - s.escapedAt > 2200) initTV1(); }
  else {
    stepTV1Ball(s, now, dt);
    s.trail.push({ x: s.ball.x, y: s.ball.y });
    if (s.trail.length > 22) s.trail.shift();
  }
  for (let i = s.particles.length - 1; i >= 0; i--){
    const p = s.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= 0.032;
    if (p.life <= 0) s.particles.splice(i, 1);
  }
}

function tvArc(g, cx, cy, rO, rI, a0, a1){
  g.beginPath();
  g.arc(cx, cy, rO, a0, a1);
  g.arc(cx, cy, rI, a1, a0, true);
  g.closePath();
}

function drawTV1(now){
  const s = tv1;
  const g = brainrotCtx;
  g.fillStyle = '#000';
  g.fillRect(0, 0, TV_W, TV_H);
  const bg = g.createRadialGradient(TV_CX, TV_CY, 0, TV_CX, TV_CY, 220);
  bg.addColorStop(0, 'rgba(80, 0, 150, 0.28)');
  bg.addColorStop(0.5, 'rgba(40, 0, 90, 0.15)');
  bg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = bg;
  g.fillRect(0, 0, TV_W, TV_H);
  for (const ring of s.rings){
    const arc = (Math.PI * 2) / ring.n;
    const gap = arc * 0.14;
    const rIn = ring.r - ring.w / 2;
    const rOut = ring.r + ring.w / 2;
    for (let i = 0; i < ring.n; i++){
      if (i === ring.gapIdx) continue;
      const tile = ring.tiles[i];
      const a0 = ring.angle + i * arc + gap / 2;
      const a1 = ring.angle + (i + 1) * arc - gap / 2;
      if (tile.active){
        g.shadowColor = ring.color; g.shadowBlur = 14;
        tvArc(g, TV_CX, TV_CY, rOut, rIn, a0, a1);
        g.fillStyle = ring.color; g.fill();
        g.shadowBlur = 0;
        g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1; g.stroke();
      } else {
        const prog = 1 - (tile.respawnAt - now) / 1600;
        if (prog > 0){
          g.globalAlpha = prog * 0.5;
          g.shadowColor = ring.color; g.shadowBlur = 20;
          tvArc(g, TV_CX, TV_CY, rOut, rIn, a0, a1);
          g.fillStyle = ring.color; g.fill();
          g.shadowBlur = 0; g.globalAlpha = 1;
        }
      }
    }
  }
  for (let i = 0; i < s.trail.length; i++){
    const a = i / s.trail.length;
    g.globalAlpha = a * a * 0.6;
    g.shadowColor = '#ff3fa4'; g.shadowBlur = 14;
    g.fillStyle = '#ff3fa4';
    g.beginPath(); g.arc(s.trail[i].x, s.trail[i].y, 1.8 + a * 6, 0, Math.PI * 2); g.fill();
  }
  g.shadowBlur = 0; g.globalAlpha = 1;
  for (const p of s.particles){
    g.globalAlpha = p.life;
    g.shadowColor = p.color; g.shadowBlur = 10;
    g.fillStyle = p.color;
    g.fillRect(p.x - 1.2, p.y - 1.2, 2.4, 2.4);
  }
  g.shadowBlur = 0; g.globalAlpha = 1;
  if (!s.escaped){
    const b = s.ball;
    g.shadowColor = '#ff3fa4'; g.shadowBlur = 22;
    g.fillStyle = '#ff3fa4';
    g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath(); g.arc(b.x - b.r * 0.3, b.y - b.r * 0.35, b.r * 0.3, 0, Math.PI * 2); g.fill();
  }
  g.font = 'bold 15px Arial, sans-serif';
  g.textAlign = 'center';
  g.shadowColor = '#00ffff'; g.shadowBlur = 10;
  g.fillStyle = '#ffffff';
  g.fillText('The ball has 40 seconds to escape', TV_CX, 24);
  g.shadowBlur = 0;
  const elapsed = ((now - s.startAt) / 1000) % 40;
  const remain = 40 - elapsed;
  const mm = Math.floor(remain / 60);
  const ss = Math.floor(remain % 60).toString().padStart(2, '0');
  g.font = 'bold 14px Arial, sans-serif';
  g.shadowColor = '#ff3fa4'; g.shadowBlur = 10;
  g.fillStyle = '#ffffff';
  g.fillText(`${mm}:${ss}`, TV_CX, TV_H - 12);
  g.shadowBlur = 0;
  if (s.escaped){
    g.globalAlpha = Math.min(1, (now - s.escapedAt) / 300);
    g.shadowColor = '#ff3fa4'; g.shadowBlur = 30;
    g.fillStyle = '#ff3fa4';
    g.font = 'bold 42px Arial, sans-serif';
    g.fillText('ESCAPED!', TV_CX, TV_CY);
    g.shadowBlur = 0; g.globalAlpha = 1;
  }
}

// ─── CH 2: MINECRAFT PARKOUR ───
const FOCAL = 320;
const BLOCK_SIZE = 1;
let tv2;

function initTV2(){
  tv2 = {
    camX: 0, camY: 2, camZ: 0, smoothX: 0, smoothY: 0,
    blocks: [], nextZ: 2, pathX: 0, pathY: 0, bobPhase: 0,
  };
  for (let i = 0; i < 10; i++){ tv2.blocks.push({ x: 0, y: 0, z: tv2.nextZ }); tv2.nextZ += 2; }
}
function genTV2(){
  const s = tv2;
  while (s.nextZ < s.camZ + 130){
    if (Math.random() < 0.55) s.pathX += (Math.random() - 0.5) * 4.5;
    if (Math.random() < 0.45) s.pathY += (Math.random() - 0.5) * 3;
    s.pathX = Math.max(-4.5, Math.min(4.5, s.pathX));
    s.pathY = Math.max(-1, Math.min(4, s.pathY));
    s.blocks.push({ x: s.pathX, y: s.pathY, z: s.nextZ });
    s.nextZ += 2;
  }
  while (s.blocks.length && s.blocks[0].z < s.camZ - 4) s.blocks.shift();
}
function proj2(px, py, pz, s){
  const dx = px - s.camX, dy = py - s.camY, dz = pz - s.camZ;
  if (dz < 0.15) return null;
  const k = FOCAL / dz;
  return { x: TV_W / 2 + dx * k, y: TV_H / 2 - dy * k, z: dz };
}
function mixRGB(a, b, t){
  return [Math.round(a[0]+(b[0]-a[0])*t), Math.round(a[1]+(b[1]-a[1])*t), Math.round(a[2]+(b[2]-a[2])*t)];
}
function rgbStr(c, k){
  k = k || 1;
  const r = Math.max(0, Math.min(255, Math.round(c[0] * k)));
  const g = Math.max(0, Math.min(255, Math.round(c[1] * k)));
  const b = Math.max(0, Math.min(255, Math.round(c[2] * k)));
  return `rgb(${r},${g},${b})`;
}
const TV_FOG = [200, 225, 245];

function drawMCCube(b, s){
  const h = BLOCK_SIZE / 2;
  const x = b.x, y = b.y, z = b.z;
  const fbl = proj2(x-h, y-h, z-h, s);
  const fbr = proj2(x+h, y-h, z-h, s);
  const ftl = proj2(x-h, y+h, z-h, s);
  const ftr = proj2(x+h, y+h, z-h, s);
  const bbl = proj2(x-h, y-h, z+h, s);
  const bbr = proj2(x+h, y-h, z+h, s);
  const btl = proj2(x-h, y+h, z+h, s);
  const btr = proj2(x+h, y+h, z+h, s);
  if (!fbl || !fbr || !ftl || !ftr || !bbl || !bbr || !btl || !btr) return;
  const dz = z - s.camZ;
  const fog = Math.min(1, Math.max(0, (dz - 10) / 60));
  const topCol = mixRGB([86, 154, 44], TV_FOG, fog);
  const sideCol = mixRGB([124, 90, 60], TV_FOG, fog);
  const darkCol = mixRGB([90, 64, 42], TV_FOG, fog);
  const darkerCol = mixRGB([64, 44, 28], TV_FOG, fog);
  const g = brainrotCtx;
  if (s.camY > y + h){
    g.beginPath();
    g.moveTo(ftl.x, ftl.y); g.lineTo(ftr.x, ftr.y);
    g.lineTo(btr.x, btr.y); g.lineTo(btl.x, btl.y);
    g.closePath();
    g.fillStyle = rgbStr(topCol); g.fill();
  }
  if (s.camY < y - h){
    g.beginPath();
    g.moveTo(fbl.x, fbl.y); g.lineTo(fbr.x, fbr.y);
    g.lineTo(bbr.x, bbr.y); g.lineTo(bbl.x, bbl.y);
    g.closePath();
    g.fillStyle = rgbStr(darkerCol); g.fill();
  }
  if (z - h > s.camZ){
    g.beginPath();
    g.moveTo(fbl.x, fbl.y); g.lineTo(fbr.x, fbr.y);
    g.lineTo(ftr.x, ftr.y); g.lineTo(ftl.x, ftl.y);
    g.closePath();
    g.fillStyle = rgbStr(sideCol); g.fill();
  }
  if (s.camX < x - h){
    g.beginPath();
    g.moveTo(fbl.x, fbl.y); g.lineTo(ftl.x, ftl.y);
    g.lineTo(btl.x, btl.y); g.lineTo(bbl.x, bbl.y);
    g.closePath();
    g.fillStyle = rgbStr(darkCol); g.fill();
  }
  if (s.camX > x + h){
    g.beginPath();
    g.moveTo(fbr.x, fbr.y); g.lineTo(ftr.x, ftr.y);
    g.lineTo(btr.x, btr.y); g.lineTo(bbr.x, bbr.y);
    g.closePath();
    g.fillStyle = rgbStr(darkCol, 0.9); g.fill();
  }
}

function updateTV2(now, dt){
  if (!tv2) initTV2();
  const s = tv2;
  s.camZ += 0.008 * dt;
  s.bobPhase += dt * 0.012;
  genTV2();
  let target = null;
  for (const b of s.blocks){
    if (b.z > s.camZ + 0.5 && (!target || b.z < target.z)) target = b;
  }
  if (!target) target = { x: 0, y: 0 };
  s.smoothX += (target.x - s.smoothX) * 0.09;
  s.smoothY += (target.y - s.smoothY) * 0.09;
  s.camX = s.smoothX;
  s.camY = s.smoothY + 2.0 + Math.sin(s.bobPhase) * 0.10;
}

function drawMCCloud(g, x, y, s){
  g.beginPath();
  g.arc(x, y, 16 * s, 0, Math.PI * 2);
  g.arc(x + 16 * s, y + 4 * s, 20 * s, 0, Math.PI * 2);
  g.arc(x + 36 * s, y, 14 * s, 0, Math.PI * 2);
  g.arc(x + 18 * s, y - 10 * s, 14 * s, 0, Math.PI * 2);
  g.fill();
}

function initTV3(){
  tv3 = {
    grass: new Float32Array(COLS * ROWS).fill(1),
    hx: 70, hy: 80, hdir: 1,
    turning: false, turnProgress: 0,
    wheatTile: makeWheatTile(), stubTile: makeStubTile(),
    dust: [], wheelSpin: 0,
  };
}

function updateTV3(now, dt){
  if (!tv3) initTV3();
  const s = tv3;
  const speed = 0.065 * dt;
  const margin = 55;
  const rowH = 40;

  if (!s.turning){
    s.hx += speed * s.hdir;
    s.wheelSpin += speed * 0.25;
    if (s.hx > TV_W - margin){ s.hx = TV_W - margin; s.turning = true; s.turnProgress = 0; }
    else if (s.hx < margin){ s.hx = margin; s.turning = true; s.turnProgress = 0; }
  } else {
    s.turnProgress += dt * 0.0016;
    s.wheelSpin += 0.03 * dt;
    if (s.turnProgress >= 1){
      s.turnProgress = 0;
      s.turning = false;
      s.hdir *= -1;
      s.hy += rowH;
      if (s.hy > TV_H + 100) s.hy = -100;
    }
  }

  if (!s.turning){
    const headOffsetX = s.hdir * 62 * HARV_SCALE;
    const headX = s.hx + headOffsetX;
    const headY = s.hy;
    const cutR = 78 * HARV_SCALE;
    const c0 = Math.max(0, Math.floor((headX - cutR) / CELL));
    const c1 = Math.min(COLS - 1, Math.floor((headX + cutR) / CELL));
    const r0 = Math.max(0, Math.floor((headY - cutR) / CELL));
    const r1 = Math.min(ROWS - 1, Math.floor((headY + cutR) / CELL));
    for (let r = r0; r <= r1; r++){
      for (let c = c0; c <= c1; c++){
        const dx = (c + 0.5) * CELL - headX;
        const dy = (r + 0.5) * CELL - headY;
        if (dx * dx + dy * dy < cutR * cutR){
          const idx = r * COLS + c;
          if (s.grass[idx] > 0.4 && Math.random() < 0.18){
            s.dust.push({
              x: (c + Math.random()) * CELL,
              y: (r + Math.random()) * CELL,
              vx: (Math.random() - 0.5) * 0.7 - s.hdir * 0.6,
              vy: (Math.random() - 0.5) * 0.7,
              life: 1,
            });
          }
          s.grass[idx] = 0;
        }
      }
    }
  }

  const regrow = 0.00016 * dt;
  for (let i = 0; i < s.grass.length; i++){
    if (s.grass[i] < 1) s.grass[i] = Math.min(1, s.grass[i] + regrow);
  }
  for (let i = s.dust.length - 1; i >= 0; i--){
    const p = s.dust[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.95; p.vy *= 0.95;
    p.life -= 0.018;
    if (p.life <= 0) s.dust.splice(i, 1);
  }
}

function drawTV3(now){
  const s = tv3;
  const g = brainrotCtx;
  g.fillStyle = '#7a6020';
  g.fillRect(0, 0, TV_W, TV_H);
  for (let r = 0; r < ROWS; r++){
    for (let c = 0; c < COLS; c++){
      const x = c * CELL;
      const y = r * CELL;
      const gv = s.grass[r * COLS + c];
      g.drawImage(s.stubTile, x, y);
      if (gv > 0.02){
        g.globalAlpha = gv;
        g.drawImage(s.wheatTile, x, y);
        g.globalAlpha = 1;
      }
    }
  }
  for (const p of s.dust){
    g.globalAlpha = p.life * 0.7;
    g.fillStyle = '#f0d878';
    g.fillRect(p.x, p.y, 2, 2);
  }
  g.globalAlpha = 1;
  drawHarvester(g, s);
  const vg = g.createRadialGradient(TV_W / 2, TV_H / 2, 100, TV_W / 2, TV_H / 2, 300);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg;
  g.fillRect(0, 0, TV_W, TV_H);
  g.font = 'bold 12px Arial';
  g.textAlign = 'left';
  g.fillStyle = 'rgba(0,0,0,0.55)';
  g.fillRect(8, 8, 170, 22);
  g.fillStyle = '#ffd970';
  g.fillText('🚜 WHEAT CAM · LIVE', 16, 24);
}

function drawBrainrot(now, dt){

  else if (brainrotMode === 1){ updateTV2(now, dt); drawTV2(now); }
  else { updateTV3(now, dt); drawTV3(now); }
  brainrotTex.needsUpdate = true;
}

function makeCardFace(rank, suit){
  const c = document.createElement('canvas'); c.width=320; c.height=448;
  const ctx = c.getContext('2d');
  const gr = ctx.createLinearGradient(0,0,0,448);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#f0eee6');
  ctx.fillStyle = gr; ctx.fillRect(0,0,320,448);
  ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth=3;
  ctx.strokeRect(10,10,300,428);
  const isRed = suit === '♥' || suit === '♦';
  ctx.fillStyle = isRed ? '#c9261a' : '#0f0f0f';
  ctx.font = 'bold 88px Georgia, serif';
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText(rank, 22, 20);
  ctx.font = '76px Georgia, serif';
  ctx.fillText(suit, 22, 118);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 200px Georgia, serif';
  ctx.fillText(suit, 160, 224);
  ctx.save();
  ctx.translate(320, 448); ctx.rotate(Math.PI);
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillStyle = isRed ? '#c9261a' : '#0f0f0f';
  ctx.font = 'bold 88px Georgia, serif';
  ctx.fillText(rank, 22, 20);
  ctx.font = '76px Georgia, serif';
  ctx.fillText(suit, 22, 118);
  ctx.restore();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 16;
  t.minFilter = THREE.LinearFilter;
  t.magFilter = THREE.LinearFilter;
  return t;
}
function makeCardBack(){
  const c = document.createElement('canvas'); c.width=320; c.height=448;
  const ctx = c.getContext('2d');
  const gr = ctx.createLinearGradient(0,0,0,448);
  gr.addColorStop(0,'#8a1a1a'); gr.addColorStop(1,'#6a1010');
  ctx.fillStyle = gr; ctx.fillRect(0,0,320,448);
  ctx.strokeStyle = 'rgba(255,220,140,0.7)'; ctx.lineWidth = 2;
  for (let i=-320;i<320;i+=22){
    ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+448,448); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i+448,0); ctx.lineTo(i,448); ctx.stroke();
  }
  ctx.strokeStyle = '#ffd76a'; ctx.lineWidth = 8;
  ctx.strokeRect(18,18,284,412);
  ctx.strokeStyle = 'rgba(255,215,106,0.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(30,30,260,388);
  ctx.fillStyle = '#ffd76a';
  ctx.font = 'bold 90px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('♠', 160, 224);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 16;
  return t;
}
const CARD_BACK_TEX = makeCardBack();

const CARD_W = 0.14, CARD_H = 0.196;

function makeCard3D(rank, suit){
  const faceTex = makeCardFace(rank, suit);
  const faceMat = new THREE.MeshStandardMaterial({ map: faceTex, roughness: 0.55 });
  const backMat = new THREE.MeshStandardMaterial({ map: CARD_BACK_TEX, roughness: 0.5 });
  const g = new THREE.Group();
  const front = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), faceMat);
  front.rotation.x = -Math.PI/2;
  front.position.y = 0.001;
  front.castShadow = true;
  g.add(front);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W, CARD_H), backMat);
  back.rotation.x = Math.PI/2;
  back.position.y = -0.001;
  g.add(back);
  g.userData.front = front;
  g.userData.back = back;
  g.userData.faceUp = false;
  back.rotation.x = -Math.PI/2;
  back.position.y = 0.001;
  front.rotation.x = Math.PI/2;
  front.position.y = -0.001;
  return g;
}
function setFaceUp(card, up){
  if (card.userData.faceUp === up) return;
  card.userData.faceUp = up;
  const f = card.userData.front, b = card.userData.back;
  if (up){
    f.rotation.x = -Math.PI/2; f.position.y = 0.001;
    b.rotation.x = Math.PI/2; b.position.y = -0.001;
  } else {
    b.rotation.x = -Math.PI/2; b.position.y = 0.001;
    f.rotation.x = Math.PI/2; f.position.y = -0.001;
  }
}

function cardPosPlayer(p, ci){
  if (p === 0){
    const off = ci === 0 ? -0.09 : 0.09;
    return { x: off, z: 0.52, rot: 0 };
  }
  const s = SEATS[p];
  const dx = -s.x, dz = -s.z;
  const len = Math.hypot(dx, dz);
  const nx = dx/len, nz = dz/len;
  const px = -nz, pz = nx;
  const off = (ci === 0 ? -0.07 : 0.07);
  return {
    x: s.x + nx * 0.52 + px * off,
    z: s.z + nz * 0.52 + pz * off,
    rot: s.rot + Math.PI
  };
}
function boardPos(i){
  const sp = 0.155;
  return { x: -2*sp + i*sp, z: -0.15, rot: 0 };
}

// ─── Авто-обёртка терминов для текстов теста ───
function autoWrapTerms(text){
  if (!text) return text;
  let result = String(text);
  const entries = Object.entries(TERMS)
    .filter(([k]) => !result.includes(`data-t="${k}"`))
    .sort((a,b) => b[1].title.length - a[1].title.length);
  for (const [key, t] of entries){
    if (result.includes(t.title)){
      result = result.split(t.title).join(`<span class="term" data-t="${key}">${t.title}</span>`);
    }
  }
  return result;
}

  el('termTitle').textContent = t.title;
  el('termBody').innerHTML = t.body;

  el('termPopup').classList.add('active');
}

function dropCards(arr, faceUp, delay = 0){
  arr.forEach((c, i) => {
    c.visible = true;
    setFaceUp(c, faceUp);
    const targetY = c.position.y;
    c.position.y = targetY + 0.3;
    c.scale.set(0.6, 0.6, 0.6);
    const start = performance.now() + i * delay;
    const anim = () => {
      const t = Math.min(1, Math.max(0, (performance.now() - start) / 500));
      const e = 1 - Math.pow(1 - t, 3);
      c.position.y = targetY + 0.3 * (1 - e);
      const s = 0.6 + 0.4 * e;
      c.scale.set(s, s, s);
      if (t < 1) requestAnimationFrame(anim);
    };
    setTimeout(anim, i * delay);
  });
}

// ═══════════════ CAMERA DRAG CONTROL ═══════════════
let camTouchId = null;
let camTouchStartX = 0, camTouchStartY = 0;
let camTouchLastX = 0, camTouchLastY = 0;

canvas.addEventListener('touchstart', e => {
  if (camTouchId !== null) return;
  const t = e.changedTouches[0];
  camTouchId = t.identifier;
  camTouchLastX = t.clientX;
  camTouchLastY = t.clientY;
}, {passive:true});

canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (t.identifier === camTouchId){
      const dx = t.clientX - camTouchLastX;
      const dy = t.clientY - camTouchLastY;
      camTouchLastX = t.clientX;
      camTouchLastY = t.clientY;
      camAngle -= dx * 0.006;
      // Убрана инверсия по Y — тянем вниз, камера опускается
      camElev += dy * 0.005;
      camAngle = Math.max(CAM_ANGLE_MIN, Math.min(CAM_ANGLE_MAX, camAngle));
      camElev = Math.max(CAM_ELEV_MIN, Math.min(CAM_ELEV_MAX, camElev));
      updateCamera();
      e.preventDefault();
    }
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches){
    if (t.identifier === camTouchId) camTouchId = null;
  }
});
canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches){
    if (t.identifier === camTouchId) camTouchId = null;
  }
});

// Mouse drag for desktop
let camMouseDown = false;
let camMouseLastX = 0, camMouseLastY = 0;
canvas.addEventListener('mousedown', e => {

  camElev = Math.max(CAM_ELEV_MIN, Math.min(CAM_ELEV_MAX, camElev));

});

let currentStep = 0;
let answered = false;

function setProgress(){
  const total = STEPS.length;
  stepLabel.textContent = `${currentStep+1} / ${total}`;
  progressFill.style.width = ((currentStep+1)/total*100) + '%';
}

function renderStep(){
  const step = STEPS[currentStep];
  tutTitle.textContent = step.title;
  let html = step.text;
  if (step.htmlExtra) html += step.htmlExtra();
  tutText.innerHTML = html;

  nextBtn.textContent = step.nextLabel || (currentStep === STEPS.length - 1 ? 'Завершить' : 'Далее →');
  backBtn.disabled = currentStep === 0;
  backBtn.style.opacity = currentStep === 0 ? '0.35' : '1';

  choicesEl.innerHTML = '';
  choicesEl.classList.remove('active');
  answered = false;

  if (step.enter) step.enter();

  if (step.choices){
    choicesEl.classList.add('active');
    step.choices.forEach((choice, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = choice.label;
      btn.addEventListener('click', () => handleChoice(i));
      choicesEl.appendChild(btn);
    });
    nextBtn.style.visibility = 'hidden';
  } else {
    nextBtn.style.visibility = 'visible';
  }

  setProgress();
}

function handleChoice(idx){
  if (answered) return;
  const step = STEPS[currentStep];
  const choice = step.choices[idx];
  const btns = choicesEl.querySelectorAll('.choice');
  btns.forEach(b => b.disabled = true);

  if (choice.correct){
    btns[idx].classList.add('correct');
  } else {
    btns[idx].classList.add('wrong');
    const ci = step.choices.findIndex(c => c.correct);
    if (ci >= 0) btns[ci].classList.add('correct');
  }
  answered = true;

  const fb = document.createElement('div');
  fb.className = 'feedback-block';
  fb.innerHTML = (choice.correct ? '✅ ' : '❌ ') + choice.feedback;
  choicesEl.appendChild(fb);

  setTimeout(() => { nextBtn.style.visibility = 'visible'; }, 400);
}

nextBtn.addEventListener('click', () => {
  if (STEPS[currentStep].isFinal){
    startQuiz();
    return;
  }
  if (currentStep < STEPS.length - 1){
    if (STEPS[currentStep].leave) STEPS[currentStep].leave();
    currentStep++;
    renderStep();
  }
});
backBtn.addEventListener('click', () => {
  if (currentStep > 0){
    if (STEPS[currentStep].leave) STEPS[currentStep].leave();
    currentStep--;
    renderStep();
  }
});

      { text: 'Олл-ин', correct: false, feedback: 'Олл-ин с J-10 — слишком агрессивно.' }
    ]
  },
  {
    scenario: 'Стрит на ривере, но на борде возможен флеш. Враг делает маленькую ставку (1/4 банка).',
    cards: [{rank:'K', suit:'♣'}, {rank:'Q', suit:'♦'}],
    board: [{rank:'J', suit:'♥'}, {rank:'10', suit:'♥'}, {rank:'9', suit:'♥'}, {rank:'2', suit:'♣'}, {rank:'4', suit:'♠'}],
    question: 'У тебя стрит. На борде 3 червы. Враг ставит дёшево. Что делать?',
    options: [
      { text: 'Фолд — вдруг флеш', correct: false, feedback: 'Фолд глуп. Ты платишь 1/4 банка за информацию.' },
      { text: 'Колл — шансы банка хороши', correct: true, feedback: 'Правильно! <b>Шансы банка</b>: платишь 1, чтобы выиграть 5. Даже если враг попал в флеш в 30% случаев, колл выгоден.' },
      { text: 'Рейз — стрит же!', correct: false, feedback: 'Рейз не обязательно ошибка, но враг мог собрать флеш.' },
      { text: 'Олл-ин', correct: false, feedback: 'Олл-ин опасен: если у врага флеш — проиграешь всё.' }
    ]
  }
];

let quizIdx = 0, quizScore = 0, quizAnswered = false;

function startQuiz(){
  quizIdx = 0; quizScore = 0;
  el('quiz').classList.add('active');
  renderQuiz();
}

function renderCardHTML(card){
  const red = (card.suit === '♥' || card.suit === '♦');
  return `<div class="qCard ${red ? 'red' : ''}">
    <div>${card.rank}${card.suit}</div>
    <div class="bc-bottom">${card.rank}${card.suit}</div>
  </div>`;
}

function renderQuiz(){
  const inner = el('quizInner');
  if (quizIdx >= QUIZ.length){
    const pct = Math.round(quizScore / QUIZ.length * 100);
    let verdict, emoji;
    if (pct >= 85){ verdict = 'Отлично! Ты готов играть осознанно.'; emoji = '🏆'; }
    else if (pct >= 60){ verdict = 'Хороший старт. Ещё практики — и будешь уверенно играть.'; emoji = '💪'; }
    else if (pct >= 35){ verdict = 'База есть, но многое интуитивно.'; emoji = '📖'; }
    else { verdict = 'Не страшно. Вернись к слайдам — там всё объяснено.'; emoji = '🌱'; }
    inner.innerHTML = `
      <div class="quiz-result">
        <div style="font-size:52px;margin-bottom:10px">${emoji}</div>
        <div class="score">${quizScore} / ${QUIZ.length}</div>
        <div class="score-label">ПРАВИЛЬНЫХ ОТВЕТОВ</div>
        <div class="verdict">${verdict}</div>
        <button class="quiz-restart" onclick="restartQuiz()">ПРОЙТИ ЗАНОВО</button>
      </div>`;
    return;
  }
  const q = QUIZ[quizIdx];
  quizAnswered = false;
  let html = `
    <div class="quiz-header">
      <h2>Финальный тест</h2>
      <div class="prog">${quizIdx+1} / ${QUIZ.length}</div>
    </div>
    <div class="quiz-scenario">
      <div class="quiz-scenario-label">Ситуация</div>
      <div style="font-size:12.5px;color:#c8d0c8;line-height:1.5">${autoWrapTerms(q.scenario)}</div>
      <div class="quiz-cards">${q.cards.map(c => renderCardHTML(c)).join('')}</div>
      ${q.board ? `
        <div style="font-size:10px;color:#8a9a8a;text-align:center;letter-spacing:2px;margin:6px 0 4px">ОБЩИЕ КАРТЫ</div>
        <div class="quiz-cards">${q.board.map(c => renderCardHTML(c)).join('')}</div>
      ` : ''}
      <div class="quiz-question">${autoWrapTerms(q.question)}</div>
    </div>
    <div class="quiz-options">`;
  q.options.forEach((opt, i) => {
    html += `<button class="qOpt" data-i="${i}">${autoWrapTerms(opt.text)}</button>`;
  });
  html += `</div><div class="quiz-feedback" id="quizFeedback"></div>`;
  inner.innerHTML = html;
  inner.querySelectorAll('.qOpt').forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (e.target.closest('.term')) return;
      handleQuizAnswer(parseInt(btn.dataset.i));
    });
  });
}

function handleQuizAnswer(i){
  if (quizAnswered) return;
  quizAnswered = true;
  const q = QUIZ[quizIdx];
  const opt = q.options[i];
  const btns = el('quizInner').querySelectorAll('.qOpt');
  btns.forEach(b => b.disabled = true);
  if (opt.correct){
    btns[i].classList.add('correct');
    quizScore++;
  } else {
    btns[i].classList.add('wrong');
    const ci = q.options.findIndex(o => o.correct);
    if (ci >= 0) btns[ci].classList.add('correct');
  }
  const fb = el('quizFeedback');
  fb.innerHTML = (opt.correct ? '✅ ' : '❌ ') + autoWrapTerms(opt.feedback);
  const nb = document.createElement('button');
  nb.className = 'quiz-restart';
  nb.style.width = '100%';
  nb.style.marginTop = '12px';
  nb.textContent = (quizIdx === QUIZ.length - 1) ? 'ПОКАЗАТЬ РЕЗУЛЬТАТ' : 'СЛЕДУЮЩИЙ ВОПРОС →';
  nb.onclick = () => { quizIdx++; renderQuiz(); };
  fb.appendChild(nb);
}

window.restartQuiz = function(){ startQuiz(); };

renderStep();

// ═══════════════ MAIN LOOP ═══════════════
let t = 0;
let lastFrameTime = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(50, now - lastFrameTime);
  lastFrameTime = now;
  t += 0.016;

  biba.position.y = 0.18 + Math.sin(t*1.1) * 0.007;
  boba.position.y = 0.18 + Math.sin(t*1.3 + 1) * 0.007;
  lampLight.intensity = 9 + Math.sin(t*3.1)*0.15 + Math.sin(t*7.7)*0.08;

  drawBrainrot(now, dt);

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
