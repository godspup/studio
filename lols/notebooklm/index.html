<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NotebookLM Bridge</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #e6edf3; --muted: #8b949e; --dim: #6e7681;
    --blue: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg2); flex-shrink: 0; gap: 8px;
  }
  .brand { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .brand a { color: var(--muted); text-decoration: none; font-size: 12px; }
  .brand a:hover { color: var(--blue); }
  .api-status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .api-status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  }
  .api-status.ok::before { background: var(--green); }
  .api-status.checking::before { background: var(--yellow); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  .nb-row {
    display: flex; gap: 6px; align-items: center;
    padding: 8px 12px; background: var(--bg2);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .nb-row select {
    flex: 1; min-width: 0;
    background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 8px 28px 8px 10px; border-radius: 6px;
    font-family: inherit; font-size: 13px; outline: none;
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%238b949e' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
    text-overflow: ellipsis;
  }
  .nb-row select:focus { border-color: var(--blue); }
  .nb-row select:disabled { opacity: 0.6; }
  .nb-row button {
    padding: 8px 11px; background: var(--bg3); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; cursor: pointer; font-size: 13px;
    flex-shrink: 0; line-height: 1;
  }
  .nb-row button:hover:not(:disabled) { border-color: var(--muted); }
  .nb-row button:disabled { opacity: 0.4; cursor: not-allowed; }
  .nb-row button.danger { color: var(--red); }
  .nb-row button.danger:hover:not(:disabled) { border-color: var(--red); }

  .chat {
    display: flex; flex-direction: column; flex: 1; min-height: 0;
    background: var(--bg);
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    user-select: text; -webkit-user-select: text;
  }
  .empty {
    color: var(--muted); text-align: center; margin: auto;
    font-size: 13px; max-width: 400px; line-height: 1.7; padding: 20px;
  }
  .msg-wrap { display: flex; flex-direction: column; gap: 4px; max-width: 88%; }
  .msg-wrap.user { align-self: flex-end; align-items: flex-end; }
  .msg-wrap.bot { align-self: flex-start; align-items: flex-start; }
  .msg {
    padding: 10px 14px; border-radius: 10px;
    white-space: pre-wrap; word-wrap: break-word; font-size: 13.5px;
    line-height: 1.6; user-select: text; -webkit-user-select: text;
    width: 100%;
  }
  .msg-user { background: #1f6feb; color: #fff; }
  .msg-bot { background: var(--bg2); border: 1px solid var(--border); }
  .msg-bot.loading { color: var(--muted); font-style: italic; }
  .msg-bot.loading::after {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border: 2px solid var(--border); border-top-color: var(--blue);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-left: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg-copy {
    padding: 3px 9px; background: transparent;
    border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; cursor: pointer; font-size: 11px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .msg-copy:hover { color: var(--text); border-color: var(--muted); }

  .chat-tools {
    display: flex; justify-content: flex-end;
    padding: 6px 16px 0; background: var(--bg2);
  }
  .chat-tools button {
    padding: 5px 10px; background: transparent;
    border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; cursor: pointer; font-size: 11px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .chat-tools button:hover { color: var(--text); border-color: var(--muted); }

  .chat-input {
    display: flex; gap: 8px; padding: 8px 16px 12px;
    background: var(--bg2); flex-shrink: 0;
  }
  .chat-input textarea {
    flex: 1; resize: none; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 10px 12px; font-family: inherit;
    font-size: 13.5px; min-height: 40px; max-height: 140px;
    outline: none; user-select: text; -webkit-user-select: text;
  }
  .chat-input textarea:focus { border-color: var(--blue); }

  button.primary {
    padding: 10px 16px; background: var(--green); border: none;
    border-radius: 6px; color: #fff; font-weight: 500; cursor: pointer;
    font-size: 13px;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .sources-panel {
    border-top: 1px solid var(--border); background: var(--bg2);
    flex-shrink: 0; display: flex; flex-direction: column;
    max-height: 50vh;
  }
  .sources-panel.collapsed .sources-body { display: none; }
  .sources-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; cursor: pointer;
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--muted); font-weight: 600;
    user-select: none; -webkit-user-select: none;
  }
  .sources-header:hover { color: var(--text); }
  .sources-header .left { display: flex; align-items: center; gap: 8px; }
  .sources-header .chev { transition: transform 0.15s; display: inline-block; font-size: 9px; }
  .sources-panel.collapsed .sources-header .chev { transform: rotate(-90deg); }
  .sources-header .actions { display: flex; gap: 6px; }
  .sources-header button {
    padding: 2px 8px; font-size: 11px; background: transparent;
    border: 1px solid var(--border); color: var(--muted); border-radius: 6px;
    cursor: pointer;
  }
  .sources-header button:hover { color: var(--text); border-color: var(--muted); }

  .sources-body {
    overflow-y: auto; flex: 1 1 auto; min-height: 0;
    display: flex; flex-direction: column;
  }
  .sources-list { padding: 0 12px; }
  .source-item {
    margin: 4px 0; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .source-item .title {
    font-weight: 500; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    line-height: 1.4;
  }
  .source-item .meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--dim); gap: 6px;
  }
  .status-badge {
    padding: 2px 8px; border-radius: 10px; font-size: 10px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
  }
  .status-ready { background: #3fb95033; color: var(--green); }
  .status-processing { background: #d2992233; color: var(--yellow); }
  .status-failed { background: #f8514933; color: var(--red); }
  .status-unknown { background: var(--bg3); color: var(--muted); }

  .add-sources {
    padding: 8px 12px 12px; border-top: 1px solid var(--border);
  }
  .add-sources textarea {
    width: 100%; resize: vertical; min-height: 70px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); padding: 8px 10px;
    font-family: inherit; font-size: 12px; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .add-sources textarea:focus { border-color: var(--blue); }
  .add-sources button {
    width: 100%; margin-top: 8px; padding: 9px;
    background: #1f6feb; border: none; border-radius: 6px;
    color: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .add-sources button:hover:not(:disabled) { filter: brightness(1.1); }
  .add-sources button:disabled { opacity: 0.5; cursor: not-allowed; }
  .add-sources .hint { font-size: 11px; color: var(--dim); margin-top: 6px; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <a href="../../">← хаб</a>
    NotebookLM Bridge
  </div>
  <div class="api-status checking" id="api-status">проверка API…</div>
</div>

<div class="nb-row">
  <select id="nb-select" title="Выбрать блокнот" disabled>
    <option value="">— нет блокнотов —</option>
  </select>
  <button id="btn-new-notebook" title="Новый блокнот">＋</button>
  <button id="btn-del-notebook" class="danger" title="Удалить блокнот" disabled>✕</button>
</div>

<main class="chat">
  <div class="chat-messages" id="chat-messages">
    <div class="empty" id="chat-empty">
      Выбери блокнот сверху или создай новый.<br>
      Добавь источники внизу, потом задавай вопросы здесь.
    </div>
  </div>
  <div class="chat-tools">
    <button id="btn-copy-chat" title="Скопировать весь чат">📋 Копировать весь чат</button>
  </div>
  <div class="chat-input">
    <textarea id="question" placeholder="Задай вопрос по источникам..." rows="1" disabled></textarea>
    <button class="primary" id="btn-ask" disabled>Отправить</button>
  </div>
</main>

<section class="sources-panel" id="sources-panel">
  <div class="sources-header" id="sources-header">
    <div class="left">
      <span class="chev">▼</span>
      <span>Источники <span id="sources-count">(0)</span></span>
    </div>
    <div class="actions">
      <button id="btn-refresh-sources" title="Обновить">🔄</button>
    </div>
  </div>
  <div class="sources-body">
    <div id="sources-list" class="sources-list">
      <div class="empty" style="margin: 12px auto; font-size: 12px;">Выбери блокнот</div>
    </div>
    <div class="add-sources">
      <textarea id="new-sources" placeholder="Вставь ссылки — каждая с новой строки.&#10;Поддерживаются YouTube-видео и целые плейлисты."></textarea>
      <button id="btn-add-sources" disabled>Добавить все</button>
      <div class="hint">Мультивыбор: разделяй переносом строки, пробелом или запятой</div>
    </div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
const API = "https://144.31.38.204.sslip.io";
const LS_ACTIVE = "nlm_active_notebook";
const LS_CHAT = (nid) => "nlm_chat_" + nid;

const $ = id => document.getElementById(id);
const state = {
  notebooks: [],
  activeNotebook: null,
  sources: [],
  messages: [],
  sourcesPollTimer: null,
  sourcesBusy: false,
};

function toast(msg, cls = "") {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + cls;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = "toast " + cls, 2500);
}

async function copyText(text) {
  if (!text) { toast("Нечего копировать", "err"); return; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast("Скопировано", "ok");
  } catch (e) {
    toast("Не удалось скопировать: " + e.message, "err");
  }
}

function setApiStatus(text, cls) {
  const el = $("api-status");
  el.className = "api-status " + (cls || "");
  el.textContent = text;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch { data = { raw: text }; }
  if (!r.ok) throw new Error(data.detail || data.raw || `HTTP ${r.status}`);
  return data;
}

async function checkHealth() {
  setApiStatus("проверка API…", "checking");
  try {
    const h = await api("GET", "/api/health");
    if (h.cli_available) setApiStatus("API ok", "ok");
    else setApiStatus("CLI недоступен", "");
  } catch (e) {
    setApiStatus("API недоступен", "");
  }
}

async function loadNotebooks() {
  try {
    const data = await api("GET", "/api/notebooks");
    state.notebooks = data.notebooks || [];
    renderNotebooks();
  } catch (e) {
    toast("Не могу получить список блокнотов: " + e.message, "err");
  }
}

function renderNotebooks() {
  const sel = $("nb-select");
  if (!state.notebooks.length) {
    sel.innerHTML = '<option value="">— нет блокнотов —</option>';
    sel.disabled = true;
    $("btn-del-notebook").disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = state.notebooks.map(nb =>
    `<option value="${escapeHtml(nb.id)}"${nb.id === state.activeNotebook ? " selected" : ""}>${escapeHtml(nb.title || nb.id)}</option>`
  ).join("");
  $("btn-del-notebook").disabled = !state.activeNotebook;
}

async function createNotebook() {
  const title = prompt("Название блокнота:", "Новый блокнот");
  if (!title) return;
  try {
    const nb = await api("POST", "/api/notebooks", { title });
    toast("Блокнот создан", "ok");
    await loadNotebooks();
    if (nb.id) selectNotebook(nb.id);
  } catch (e) {
    toast("Ошибка: " + e.message, "err");
  }
}

async function deleteNotebook() {
  const nid = state.activeNotebook;
  if (!nid) { toast("Сначала выбери блокнот", "err"); return; }
  if (!confirm("Удалить блокнот? Все источники и история тоже удалятся.")) return;
  try {
    await api("DELETE", "/api/notebooks/" + nid);
    localStorage.removeItem(LS_ACTIVE);
    state.activeNotebook = null;
    state.sources = [];
    state.messages = [];
    renderSources();
    renderChat();
    toast("Удалено", "ok");
    await loadNotebooks();
    if (state.notebooks.length) {
      selectNotebook(state.notebooks[0].id);
    } else {
      $("question").disabled = true;
      $("btn-ask").disabled = true;
      $("btn-add-sources").disabled = true;
    }
  } catch (e) {
    toast("Ошибка: " + e.message, "err");
  }
}

function selectNotebook(nid) {
  state.activeNotebook = nid;
  localStorage.setItem(LS_ACTIVE, nid);
  state.messages = JSON.parse(localStorage.getItem(LS_CHAT(nid)) || "[]");
  renderNotebooks();
  renderChat();
  $("question").disabled = false;
  $("btn-ask").disabled = false;
  $("btn-add-sources").disabled = false;
  loadSources();
}

async function loadSources() {
  if (!state.activeNotebook || state.sourcesBusy) return;
  state.sourcesBusy = true;
  try {
    const data = await api("GET", `/api/notebooks/${state.activeNotebook}/sources`);
    state.sources = data.sources || [];
    renderSources();
    const hasProcessing = state.sources.some(s => {
      const st = (s.status || "").toLowerCase();
      return st.includes("process") || st.includes("pending") || st.includes("queue") || st === "unknown" || st === "";
    });
    if (hasProcessing && !state.sourcesPollTimer) {
      state.sourcesPollTimer = setInterval(() => {
        if (!state.sourcesBusy) loadSources();
      }, 5000);
    } else if (!hasProcessing && state.sourcesPollTimer) {
      clearInterval(state.sourcesPollTimer);
      state.sourcesPollTimer = null;
    }
  } catch (e) {
    console.warn("loadSources error", e);
  } finally {
    state.sourcesBusy = false;
  }
}

function statusClass(status) {
  const s = (status || "").toLowerCase();
  if (s.includes("ready") || s.includes("complete") || s === "done") return "status-ready";
  if (s.includes("process") || s.includes("pending") || s.includes("queue")) return "status-processing";
  if (s.includes("fail") || s.includes("error")) return "status-failed";
  return "status-unknown";
}

function renderSources() {
  const box = $("sources-list");
  const cnt = $("sources-count");
  cnt.textContent = "(" + state.sources.length + ")";
  if (!state.activeNotebook) {
    box.innerHTML = '<div class="empty" style="margin:12px auto;font-size:12px;">Выбери блокнот</div>';
    return;
  }
  if (!state.sources.length) {
    box.innerHTML = '<div class="empty" style="margin:12px auto;font-size:12px;">Нет источников — добавь ссылки ниже</div>';
    return;
  }
  box.innerHTML = state.sources.map(s => `
    <div class="source-item">
      <div class="title">${escapeHtml(s.title || s.id || "—")}</div>
      <div class="meta">
        <span>${escapeHtml(s.kind || "")}</span>
        <span class="status-badge ${statusClass(s.status)}">${escapeHtml(s.status || "?")}</span>
      </div>
    </div>
  `).join("");
}

async function addSources() {
  const raw = $("new-sources").value.trim();
  if (!raw) { toast("Вставь хотя бы одну ссылку", "err"); return; }
  if (!state.activeNotebook) { toast("Сначала выбери блокнот", "err"); return; }

  const urls = raw.split(/[\s,\n]+/).map(s => s.trim()).filter(s => s.startsWith("http"));
  if (!urls.length) { toast("Не нашёл ссылок", "err"); return; }

  $("btn-add-sources").disabled = true;
  $("btn-add-sources").textContent = `Добавляю ${urls.length}...`;
  toast(`Отправлено ${urls.length} ссылок (может занять минуту)`, "");

  try {
    const res = await api("POST", `/api/notebooks/${state.activeNotebook}/sources`, { urls });
    const ok = (res.added || []).length;
    const err = (res.errors || []).length;
    if (err) {
      toast(`Добавлено ${ok}, ошибок ${err}`, "err");
    } else {
      toast(`Добавлено ${ok}`, "ok");
      $("new-sources").value = "";
    }
    loadSources();
  } catch (e) {
    toast("Ошибка: " + e.message, "err");
  } finally {
    $("btn-add-sources").disabled = false;
    $("btn-add-sources").textContent = "Добавить все";
  }
}

function renderChat() {
  const box = $("chat-messages");
  if (!state.messages.length) {
    box.innerHTML = '<div class="empty" id="chat-empty">Выбери блокнот сверху или создай новый.<br>Добавь источники внизу, потом задавай вопросы здесь.</div>';
    return;
  }
  box.innerHTML = state.messages.map((m, idx) => {
    if (m.role === "user") {
      return `<div class="msg-wrap user"><div class="msg msg-user">${escapeHtml(m.text)}</div></div>`;
    }
    const loading = m.loading ? " loading" : "";
    const copyBtn = m.loading ? "" :
      `<button class="msg-copy" data-copy-idx="${idx}" title="Скопировать">📋 Копировать</button>`;
    return `<div class="msg-wrap bot"><div class="msg msg-bot${loading}">${escapeHtml(m.text)}</div>${copyBtn}</div>`;
  }).join("");
  box.querySelectorAll(".msg-copy").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.copyIdx, 10);
      const m = state.messages[i];
      if (m) copyText(m.text);
    });
  });
  box.scrollTop = box.scrollHeight;
}

function saveChat() {
  if (!state.activeNotebook) return;
  localStorage.setItem(LS_CHAT(state.activeNotebook), JSON.stringify(state.messages));
}

function copyWholeChat() {
  if (!state.messages.length) { toast("Чат пуст", "err"); return; }
  const nb = state.notebooks.find(n => n.id === state.activeNotebook);
  const head = nb ? `# ${nb.title}\n\n` : "";
  const body = state.messages.filter(m => !m.loading).map(m => {
    if (m.role === "user") return `## Я\n${m.text}\n`;
    return `## NotebookLM\n${m.text}\n`;
  }).join("\n");
  copyText(head + body);
}

async function askQuestion() {
  const q = $("question").value.trim();
  if (!q || !state.activeNotebook) return;
  $("question").value = "";
  $("question").style.height = "auto";
  $("btn-ask").disabled = true;

  state.messages.push({ role: "user", text: q });
  state.messages.push({ role: "bot", text: "NotebookLM думает…", loading: true });
  saveChat();
  renderChat();

  try {
    const res = await api("POST", `/api/notebooks/${state.activeNotebook}/ask`, { question: q });
    state.messages = state.messages.filter(m => !m.loading);
    state.messages.push({ role: "bot", text: res.answer || "(пустой ответ)" });
    saveChat();
    renderChat();
  } catch (e) {
    state.messages = state.messages.filter(m => !m.loading);
    state.messages.push({ role: "bot", text: "⚠ Ошибка: " + e.message });
    saveChat();
    renderChat();
  } finally {
    $("btn-ask").disabled = false;
  }
}

$("btn-new-notebook").onclick = createNotebook;
$("btn-del-notebook").onclick = deleteNotebook;
$("btn-refresh-sources").onclick = (e) => { e.stopPropagation(); loadSources(); };
$("btn-add-sources").onclick = addSources;
$("btn-ask").onclick = askQuestion;
$("btn-copy-chat").onclick = copyWholeChat;

$("nb-select").onchange = (e) => {
  const v = e.target.value;
  if (v) selectNotebook(v);
};

$("sources-header").onclick = () => {
  $("sources-panel").classList.toggle("collapsed");
};

$("question").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    askQuestion();
  }
});

$("question").addEventListener("input", e => {
  const t = e.target;
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 140) + "px";
});

(async function init() {
  await checkHealth();
  await loadNotebooks();
  const saved = localStorage.getItem(LS_ACTIVE);
  if (saved && state.notebooks.find(n => n.id === saved)) {
    selectNotebook(saved);
  } else if (state.notebooks.length) {
    selectNotebook(state.notebooks[0].id);
  }
  setInterval(checkHealth, 60000);
})();
</script>
</body>
