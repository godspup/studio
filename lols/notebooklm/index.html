<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5efe6">
<title>NotebookLM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5efe6;
    --surface: #fffcf6;
    --surface-2: #ede4d6;
    --surface-3: #e5d8c4;
    --border: #dfd3c1;
    --border-strong: #c9b8a0;
    --text: #2f2721;
    --text-muted: #8a7a68;
    --text-dim: #b3a695;
    --accent: #b86545;
    --accent-hover: #a35538;
    --accent-soft: #f5e0d2;
    --ok: #6e8f5a;
    --warn: #c19a3e;
    --err: #c25648;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(60, 40, 20, 0.06);
    --shadow: 0 4px 12px rgba(60, 40, 20, 0.08);
    --shadow-lg: 0 12px 32px rgba(60, 40, 20, 0.14);
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    flex-shrink: 0;
  }
  .back {
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; background: var(--surface); color: var(--text);
    text-decoration: none; font-size: 17px;
    box-shadow: var(--shadow-sm); border: 1px solid var(--border);
    flex-shrink: 0; transition: background 0.15s;
  }
  .back:active { background: var(--surface-2); }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; flex: 1; }
  .status {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim); flex-shrink: 0; transition: background 0.2s, box-shadow 0.2s;
  }
  .status.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(110, 143, 90, 0.18); }
  .status.err { background: var(--err); }
  .status.checking { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }

  .nb-pill {
    display: flex; align-items: center; gap: 10px;
    margin: 0 14px 12px;
    padding: 12px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); cursor: pointer;
    font-family: inherit; font-size: 15px; text-align: left;
    box-shadow: var(--shadow-sm); flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
  }
  .nb-pill:active { transform: scale(0.985); background: var(--surface-2); }
  .nb-pill .icon { font-size: 18px; flex-shrink: 0; }
  .nb-pill .title {
    flex: 1; min-width: 0; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nb-pill .title.placeholder { color: var(--text-dim); font-weight: 400; }
  .nb-pill .chev { font-size: 10px; color: var(--text-muted); flex-shrink: 0; }

  .chat {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px 14px 16px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
    user-select: text; -webkit-user-select: text;
  }
  .empty {
    margin: auto; text-align: center; color: var(--text-muted);
    font-size: 14px; line-height: 1.6; max-width: 280px; padding: 20px;
  }
  .empty .icon { font-size: 42px; display: block; margin-bottom: 14px; opacity: 0.5; }
  .empty .title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }

  .msg-row { display: flex; flex-direction: column; gap: 5px; max-width: 88%; }
  .msg-row.user { align-self: flex-end; align-items: flex-end; }
  .msg-row.bot { align-self: flex-start; align-items: flex-start; }
  .msg {
    padding: 11px 15px; border-radius: 18px;
    font-size: 15px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
    user-select: text; -webkit-user-select: text;
    animation: msgIn 0.22s ease-out;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    background: var(--accent); color: #fffaf3;
    border-bottom-right-radius: 6px;
    box-shadow: 0 2px 8px rgba(184, 101, 69, 0.22);
  }
  .msg.bot {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
    box-shadow: var(--shadow-sm);
  }
  .msg.bot.loading { color: var(--text-muted); font-style: italic; }
  .msg.bot.loading::after {
    content: ""; display: inline-block;
    width: 10px; height: 10px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-left: 8px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .copy-btn {
    padding: 4px 10px; background: transparent;
    border: 1px solid var(--border); border-radius: 12px;
    color: var(--text-muted); cursor: pointer;
    font-size: 11px; font-family: inherit;
    display: inline-flex; align-items: center; gap: 4px;
    transition: color 0.15s, border-color 0.15s, transform 0.08s;
  }
  .copy-btn:active { transform: scale(0.94); color: var(--text); border-color: var(--border-strong); }

  .dock {
    flex-shrink: 0; padding: 10px 14px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .dock-tools { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .dock-tools::-webkit-scrollbar { display: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px;
    color: var(--text-muted); cursor: pointer; font-family: inherit;
    font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: all 0.15s; flex-shrink: 0;
  }
  .chip:active { transform: scale(0.97); color: var(--text); border-color: var(--border-strong); }
  .chip-badge {
    min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 9px; font-size: 11px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center;
  }

  .dock-input { display: flex; gap: 8px; align-items: flex-end; }
  .dock-input textarea {
    flex: 1; resize: none;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; color: var(--text);
    padding: 11px 16px; font-family: inherit; font-size: 15px; line-height: 1.4;
    min-height: 44px; max-height: 130px; outline: none;
    transition: border-color 0.15s;
    user-select: text; -webkit-user-select: text;
  }
  .dock-input textarea:focus { border-color: var(--accent); }
  .dock-input textarea:disabled { opacity: 0.5; }
  .send {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); border: none; color: #fffaf3;
    font-size: 19px; font-weight: 600; cursor: pointer;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.08s;
    box-shadow: 0 2px 8px rgba(184, 101, 69, 0.3);
  }
  .send:active:not(:disabled) { transform: scale(0.92); background: var(--accent-hover); }
  .send:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(60, 40, 20, 0.4);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
    z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; bottom: 0; left: 0; right: 0;
    max-height: 88vh; background: var(--surface);
    border-radius: 22px 22px 0 0;
    display: flex; flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -8px 32px rgba(60, 40, 20, 0.18);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .overlay.open .sheet { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 20px 12px;
    font-size: 16px; font-weight: 600; flex-shrink: 0;
  }
  .sheet-head-actions { display: flex; gap: 6px; }
  .sheet-close, .sheet-icon {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface-2); border: none;
    color: var(--text-muted); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .sheet-close:active, .sheet-icon:active { background: var(--surface-3); color: var(--text); }
  .sheet-body {
    overflow-y: auto; flex: 1; min-height: 0;
    padding: 4px 14px 20px;
    user-select: text; -webkit-user-select: text;
  }
  .sheet-foot { padding: 0 14px 14px; flex-shrink: 0; }

  .nb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background 0.12s;
    background: transparent; border: none; width: 100%;
    text-align: left; font-family: inherit; font-size: 15px;
    color: var(--text); margin-bottom: 4px;
  }
  .nb-item:active { background: var(--surface-2); }
  .nb-item.active { background: var(--accent-soft); color: var(--accent); }
  .nb-item.active .nb-item-title { font-weight: 600; }
  .nb-item-title {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .nb-item-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
  }
  .nb-item-del {
    width: 30px; height: 30px; border-radius: 50%;
    background: transparent; border: none;
    color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .nb-item-del:active { background: rgba(194, 86, 72, 0.12); color: var(--err); }

  .source-card {
    padding: 13px 15px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
  }
  .source-card .s-title {
    font-size: 14px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; line-height: 1.35;
  }
  .source-card .s-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; font-size: 11.5px; color: var(--text-dim);
  }
  .s-badge {
    padding: 3px 9px; border-radius: 10px;
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .s-ready { background: rgba(110, 143, 90, 0.14); color: var(--ok); }
  .s-processing { background: rgba(193, 154, 62, 0.16); color: var(--warn); }
  .s-failed { background: rgba(194, 86, 72, 0.14); color: var(--err); }
  .s-unknown { background: var(--surface-3); color: var(--text-dim); }

  .add-sources {
    margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .add-sources textarea {
    width: 100%; min-height: 76px;
    padding: 11px 14px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--text); font-family: inherit; font-size: 14px;
    resize: vertical; outline: none;
    user-select: text; -webkit-user-select: text;
  }
  .add-sources textarea:focus { border-color: var(--accent); }
  .add-sources .hint {
    font-size: 12px; color: var(--text-dim);
    margin-top: 8px; line-height: 1.4;
  }

  .btn-primary {
    width: 100%; padding: 13px;
    background: var(--accent); border: none;
    border-radius: var(--radius-sm); color: #fffaf3;
    font-weight: 600; font-size: 15px; font-family: inherit;
    cursor: pointer; transition: background 0.15s, transform 0.08s;
    margin-top: 10px;
  }
  .btn-primary:active:not(:disabled) { transform: scale(0.985); background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .sheet-foot .btn-primary { margin-top: 0; }

  .toast {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%; transform: translate(-50%, 20px);
    padding: 11px 20px; background: var(--text); color: var(--bg);
    border-radius: 22px; font-size: 13.5px; font-weight: 500;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    max-width: 90vw; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--err); color: #fffaf3; }
  .toast.ok { background: var(--ok); color: #fffaf3; }

  .msg.bot { white-space: normal; }
  .msg.bot p { margin: 0 0 8px; }
  .msg.bot p:last-child { margin-bottom: 0; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3, .msg.bot h4, .msg.bot h5, .msg.bot h6 {
    margin: 10px 0 6px; line-height: 1.3; font-weight: 600;
  }
  .msg.bot h1 { font-size: 18px; }
  .msg.bot h2 { font-size: 16px; }
  .msg.bot h3 { font-size: 15px; }
  .msg.bot h4, .msg.bot h5, .msg.bot h6 { font-size: 14px; }
  .msg.bot ul, .msg.bot ol { margin: 6px 0 8px; padding-left: 22px; }
  .msg.bot li { margin: 3px 0; }
  .msg.bot code {
    background: var(--surface-2); padding: 1px 5px; border-radius: 4px;
    font-size: 0.9em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .msg.bot pre {
    background: var(--surface-2); padding: 10px 12px; border-radius: 8px;
    overflow-x: auto; margin: 8px 0;
  }
  .msg.bot pre code { background: none; padding: 0; font-size: 0.88em; }
  .msg.bot a { color: var(--accent); text-decoration: underline; }
  .msg.bot strong { font-weight: 600; }
  .msg.bot em { font-style: italic; }

  .source-card .s-head { display: flex; align-items: flex-start; gap: 8px; }
  .source-card .s-head .s-title { flex: 1; min-width: 0; }
  .source-card .s-del {
    width: 28px; height: 28px; border-radius: 50%;
    background: transparent; border: none;
    color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    transition: background 0.15s, color 0.15s;
  }
  .source-card .s-del:active { background: rgba(194, 86, 72, 0.12); color: var(--err); }

</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="../../" title="Хаб">←</a>
  <div class="brand">NotebookLM</div>
  <div class="status checking" id="api-status"></div>
</header>

<button class="nb-pill" id="nb-pill">
  <span class="icon">📓</span>
  <span class="title placeholder" id="nb-title">— выбери блокнот —</span>
  <span class="chev">▼</span>
</button>

<main class="chat" id="chat-messages"></main>

<div class="dock">
  <div class="dock-tools">
    <button class="chip" id="chip-sources">
      <span>📎 Источники</span>
      <span class="chip-badge" id="sources-badge">0</span>
    </button>
    <button class="chip" id="chip-copy-all">
      <span>📋 Весь чат</span>
    </button>
  </div>
  <div class="dock-input">
    <textarea id="question" rows="1" placeholder="Спроси что-нибудь…" disabled></textarea>
    <button class="send" id="btn-ask" disabled>↑</button>
  </div>
</div>

<div class="overlay" id="overlay-nb">
  <div class="sheet">
    <div class="sheet-head">
      <span>Блокноты</span>
      <button class="sheet-close" data-close="nb">✕</button>
    </div>
    <div class="sheet-body">
      <div id="nb-list"></div>
    </div>
    <div class="sheet-foot">
      <button class="btn-primary" id="btn-new-notebook">＋ Новый блокнот</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay-src">
  <div class="sheet">
    <div class="sheet-head">
      <span>Источники</span>
      <div class="sheet-head-actions">
        <button class="sheet-icon" id="btn-refresh-sources" title="Обновить">⟳</button>
        <button class="sheet-close" data-close="src">✕</button>
      </div>
    </div>
    <div class="sheet-body">
      <div id="sources-list"></div>
      <div class="add-sources">
        <textarea id="new-sources" placeholder="Вставь ссылки — каждая с новой строки"></textarea>
        <button class="btn-primary" id="btn-add-sources" disabled>Добавить</button>
        <div class="hint">Мультивыбор: перенос строки, пробел или запятая</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const MOCK = location.protocol === "file:";
const API = "https://144.31.38.204.sslip.io";
const LS_ACTIVE = "nlm_active_notebook";
const LS_CHAT = nid => "nlm_chat_" + nid;

const $ = id => document.getElementById(id);
const state = {
  notebooks: [],
  activeNotebook: null,
  sources: [],
  messages: [],
  sourcesPollTimer: null,
  sourcesBusy: false,
};

function toast(msg, cls) {
  cls = cls || "";
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show " + cls;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = "toast " + cls; }, 2400);
}

async function copyText(text) {
  if (!text) { toast("Нечего копировать", "err"); return; }
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    toast("Скопировано", "ok");
  } catch (e) {
    toast("Не удалось скопировать: " + e.message, "err");
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function setStatus(cls) {
  const el = $("api-status");
  el.className = "status " + (cls || "");
}

const mock = {
  notebooks: [
    { id: "n1", title: "Test - Rick Astley" },
    { id: "n2", title: "Новый блокнот" },
    { id: "n3", title: "Бюджетный локальный ИИ: тесты hardware-сборок для LLM" },
    { id: "n4", title: "LLM Aspect Summarization and Automated Analysis Research" },
  ],
  sources: {
    n1: [{ id: "s1", title: "Rick Astley - Never Gonna Give You Up (Official Video)", kind: "youtube", status: "ready" }],
    n2: [],
    n3: [
      { id: "s2", title: "Как запустить ИИ дома и не разориться", kind: "youtube", status: "ready" },
      { id: "s3", title: "Сборка ПК для локальных LLM 2024", kind: "youtube", status: "ready" },
      { id: "s4", title: "GPU vs CPU for inference", kind: "youtube", status: "processing" },
    ],
    n4: [],
  },
  chats: {
    n1: [
      { role: "user", text: "О чём эта песня?" },
      { role: "bot", text: "Классический хит 1987 года. Основная тема — преданность и обещание никогда не подвести человека [1, 2].\n\nПесня стала интернет-мемом благодаря рикроллингу — практике неожиданной подмены ссылки." },
    ],
    n3: [
      { role: "user", text: "Что важнее для локальной LLM — GPU или CPU?" },
      { role: "bot", text: "Для инференса LLM GPU значительно быстрее. CPU справится, но генерация токенов будет медленнее в 10-50 раз.\n\nДля бюджетной сборки ключевой параметр — объём VRAM: модель должна поместиться в видеопамять целиком, иначе скорость падает в разы из-за свопа." },
    ],
    n4: [],
  },
};

async function mockApi(method, path, body) {
  await new Promise(r => setTimeout(r, 120));
  if (path === "/api/health") return { cli_available: true, cli_version: "mock" };
  if (path === "/api/notebooks" && method === "GET") return { notebooks: mock.notebooks };
  const mSrc = path.match(/^\/api\/notebooks\/([^/]+)\/sources$/);
  if (mSrc && method === "GET") return { sources: mock.sources[mSrc[1]] || [] };
  if (path.startsWith("/api/notebooks/") && path.endsWith("/ask") && method === "POST") {
    return { answer: "_(это мок-ответ в превью — реальный ответ придёт с сервера)_\n\nСейчас ты видишь демонстрационный интерфейс. Здесь будет настоящий ответ NotebookLM с цитатами по источникам." };
  }
  return {};
}

function errorText(e) {
  if (!e) return "Неизвестная ошибка";
  if (e.isAuth) return "🔐 " + e.message;
  return "⚠ " + e.message;
}

function toastError(e) {
  if (e && e.isAuth) setStatus("err");
  toast(e && e.message ? e.message : "Неизвестная ошибка", "err");
}

async function api(method, path, body) {
  if (MOCK) return mockApi(method, path, body);
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  let r;
  try {
    r = await fetch(API + path, opts);
  } catch (e) {
    throw new Error("Нет связи с сервером. Проверь интернет или попробуй позже.");
  }
  const text = await r.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = { raw: text }; }
  if (!r.ok) {
    const raw = data.detail || data.raw || ("HTTP " + r.status);
    if (r.status === 401 || /auth_expired|master[- ]?token|authentication error|perform_oauth|re-bootstrap/i.test(String(raw))) {
      const err = new Error("Ошибка авторизации. Google выкинул сессию. Скажи godspup чтобы залогинился снова (nlm-relogin на сервере).");
      err.isAuth = true;
      throw err;
    }
    throw new Error(String(raw));
  }
  return data;
}

async function checkHealth() {
  setStatus("checking");
  try {
    const h = await api("GET", "/api/health");
    setStatus(h.cli_available ? "ok" : "err");
  } catch (e) {
    setStatus("err");
  }
}

async function loadNotebooks() {
  try {
    const data = await api("GET", "/api/notebooks");
    state.notebooks = data.notebooks || [];
    renderNotebooksList();
    renderNotebookPill();
  } catch (e) {
    toastError(e);
  }
}

function renderNotebookPill() {
  const title = $("nb-title");
  const nb = state.notebooks.find(n => n.id === state.activeNotebook);
  if (nb) {
    title.textContent = nb.title || nb.id;
    title.classList.remove("placeholder");
  } else {
    title.textContent = state.notebooks.length ? "— выбери блокнот —" : "— нет блокнотов —";
    title.classList.add("placeholder");
  }
}

function renderNotebooksList() {
  const box = $("nb-list");
  if (!state.notebooks.length) {
    box.innerHTML = '<div class="empty" style="padding:20px;">Пока нет блокнотов. Создай первый.</div>';
    return;
  }
  box.innerHTML = state.notebooks.map(nb => {
    const active = nb.id === state.activeNotebook;
    return `
      <button class="nb-item${active ? " active" : ""}" data-id="${escapeHtml(nb.id)}">
        <span class="nb-item-title">${escapeHtml(nb.title || nb.id)}</span>
        ${active ? '<span class="nb-item-dot"></span>' : ""}
        <span class="nb-item-del" data-del="${escapeHtml(nb.id)}" title="Удалить">✕</span>
      </button>
    `;
  }).join("");
  box.querySelectorAll(".nb-item").forEach(el => {
    el.addEventListener("click", ev => {
      if (ev.target.closest(".nb-item-del")) return;
      selectNotebook(el.dataset.id);
      closeSheet("nb");
    });
  });
  box.querySelectorAll(".nb-item-del").forEach(el => {
    el.addEventListener("click", ev => {
      ev.stopPropagation();
      deleteNotebook(el.dataset.del);
    });
  });
}

async function createNotebook() {
  const title = prompt("Название блокнота:", "Новый блокнот");
  if (!title) return;
  try {
    const nb = await api("POST", "/api/notebooks", { title });
    toast("Блокнот создан", "ok");
    await loadNotebooks();
    if (nb.id) { selectNotebook(nb.id); closeSheet("nb"); }
  } catch (e) {
    toastError(e);
  }
}

async function deleteNotebook(nid) {
  if (!confirm("Удалить блокнот? Все источники и история тоже удалятся.")) return;
  try {
    await api("DELETE", "/api/notebooks/" + nid);
    try { localStorage.removeItem(LS_CHAT(nid)); } catch (e) {}
    if (state.activeNotebook === nid) {
      state.activeNotebook = null;
      state.sources = [];
      state.messages = [];
      try { localStorage.removeItem(LS_ACTIVE); } catch (e) {}
      renderNotebookPill();
      renderChat();
      renderSources();
      $("question").disabled = true;
      $("btn-ask").disabled = true;
      $("btn-add-sources").disabled = true;
    }
    toast("Удалено", "ok");
    await loadNotebooks();
    if (!state.activeNotebook && state.notebooks.length) {
      selectNotebook(state.notebooks[0].id);
    }
  } catch (e) {
    toastError(e);
  }
}

function selectNotebook(nid) {
  state.activeNotebook = nid;
  try { localStorage.setItem(LS_ACTIVE, nid); } catch (e) {}
  state.messages = loadMessages(nid);
  renderNotebookPill();
  renderNotebooksList();
  renderChat();
  $("question").disabled = false;
  $("btn-ask").disabled = false;
  $("btn-add-sources").disabled = false;
  loadSources();
}

function loadMessages(nid) {
  if (MOCK) return (mock.chats[nid] || []).slice();
  try {
    const raw = localStorage.getItem(LS_CHAT(nid));
    if (!raw) return [];
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return [];
    return arr.filter(m => m && typeof m.text === "string" && !m.loading && (m.role === "user" || m.role === "bot"));
  } catch (e) {
    console.warn("loadMessages failed", e);
    return [];
  }
}

function saveMessages() {
  if (!state.activeNotebook) return;
  if (MOCK) return;
  try {
    const clean = state.messages.filter(m => !m.loading);
    localStorage.setItem(LS_CHAT(state.activeNotebook), JSON.stringify(clean));
  } catch (e) {
    console.warn("saveMessages failed", e);
  }
}

function inlineMD(s) {
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function renderMarkdown(text) {
  let s = escapeHtml(text);
  const codeBlocks = [];
  s = s.replace(/```([\s\S]*?)```/g, (m, code) => {
    const i = codeBlocks.length;
    codeBlocks.push(code.replace(/^[a-zA-Z0-9_+-]*\n/, ''));
    return '\u0000CB' + i + '\u0000';
  });
  const lines = s.split('\n');
  const out = [];
  let listBuf = null;
  let paraBuf = [];
  function flushList() {
    if (!listBuf) return;
    const tag = listBuf.type === 'ul' ? 'ul' : 'ol';
    out.push('<' + tag + '>' + listBuf.items.map(x => '<li>' + x + '</li>').join('') + '</' + tag + '>');
    listBuf = null;
  }
  function flushPara() {
    if (!paraBuf.length) return;
    out.push('<p>' + paraBuf.join('<br>') + '</p>');
    paraBuf = [];
  }
  for (const line of lines) {
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushList(); flushPara();
      const lvl = h[1].length;
      out.push('<h' + lvl + '>' + inlineMD(h[2]) + '</h' + lvl + '>');
      continue;
    }
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      flushPara();
      if (!listBuf || listBuf.type !== 'ul') { flushList(); listBuf = { type: 'ul', items: [] }; }
      listBuf.items.push(inlineMD(ul[1]));
      continue;
    }
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ol) {
      flushPara();
      if (!listBuf || listBuf.type !== 'ol') { flushList(); listBuf = { type: 'ol', items: [] }; }
      listBuf.items.push(inlineMD(ol[1]));
      continue;
    }
    if (line.trim() === '') { flushList(); flushPara(); continue; }
    flushList();
    paraBuf.push(inlineMD(line));
  }
  flushList(); flushPara();
  let html = out.join('');
  html = html.replace(/\u0000CB(\d+)\u0000/g, (m, i) => '<pre><code>' + codeBlocks[+i] + '</code></pre>');
  return html;
}

function renderChat() {
  const box = $("chat-messages");
  if (!state.activeNotebook) {
    box.innerHTML = '<div class="empty"><span class="icon">📓</span><div class="title">Блокнот не выбран</div>Выбери блокнот сверху или создай новый</div>';
    return;
  }
  if (!state.messages.length) {
    box.innerHTML = '<div class="empty"><span class="icon">✨</span><div class="title">Пустой чат</div>Добавь источники (📎 внизу) и задай вопрос</div>';
    return;
  }
  let lastUserIdx = -1;
  for (let i = state.messages.length - 1; i >= 0; i--) {
    if (state.messages[i].role === "user") { lastUserIdx = i; break; }
  }
  box.innerHTML = state.messages.map((m, idx) => {
    if (m.role === "user") {
      const btn = idx === lastUserIdx
        ? '<button class="copy-btn" data-edit="' + idx + '" title="Изменить">✏️ Изменить</button>'
        : "";
      return '<div class="msg-row user"><div class="msg user">' + escapeHtml(m.text) + '</div>' + btn + '</div>';
    }
    const loadingCls = m.loading ? " loading" : "";
    const inner = m.loading ? escapeHtml(m.text) : renderMarkdown(m.text);
    const btn = m.loading ? "" :
      '<button class="copy-btn" data-copy="' + idx + '" title="Копировать">📋 Копировать</button>';
    return '<div class="msg-row bot"><div class="msg bot' + loadingCls + '">' + inner + '</div>' + btn + '</div>';
  }).join("");
  box.querySelectorAll(".copy-btn[data-copy]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.copy, 10);
      const m = state.messages[i];
      if (m) copyText(m.text);
    });
  });
  box.querySelectorAll(".copy-btn[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.dataset.edit, 10);
      editMessage(i);
    });
  });
  box.scrollTop = box.scrollHeight;
}

function editMessage(idx) {
  const m = state.messages[idx];
  if (!m || m.role !== "user") return;
  const text = m.text;
  state.messages = state.messages.slice(0, idx);
  saveMessages();
  renderChat();
  const ta = $("question");
  ta.value = text;
  ta.focus();
  ta.style.height = "auto";
  ta.style.height = Math.min(ta.scrollHeight, 130) + "px";
}

function copyAllChat() {
  if (!state.messages.length) { toast("Чат пуст", "err"); return; }
  const nb = state.notebooks.find(n => n.id === state.activeNotebook);
  const head = nb ? ("# " + nb.title + "\n\n") : "";
  const body = state.messages
    .filter(m => !m.loading)
    .map(m => m.role === "user" ? ("## Я\n" + m.text + "\n") : ("## NotebookLM\n" + m.text + "\n"))
    .join("\n");
  copyText(head + body);
}

async function askQuestion() {
  const q = $("question").value.trim();
  if (!q || !state.activeNotebook) return;
  const nid = state.activeNotebook;
  $("question").value = "";
  $("question").style.height = "auto";
  $("btn-ask").disabled = true;

  state.messages.push({ role: "user", text: q });
  state.messages.push({ role: "bot", text: "NotebookLM думает…", loading: true });
  try {
    const clean = state.messages.filter(m => !m.loading);
    localStorage.setItem(LS_CHAT(nid), JSON.stringify(clean));
  } catch (e) {}
  renderChat();

  clearTimeout(askQuestion._timer);
  askQuestion._timer = setTimeout(() => {
    if (state.activeNotebook !== nid) return;
    const i = state.messages.findIndex(m => m.loading);
    if (i >= 0) {
      state.messages[i].text = "Всё ещё думает, ничего не сломалось (наверное)…";
      renderChat();
    }
  }, 20000);

  function saveAnswer(text) {
    let arr = [];
    try {
      const raw = localStorage.getItem(LS_CHAT(nid));
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          arr = parsed.filter(m => m && !m.loading && typeof m.text === "string" && (m.role === "user" || m.role === "bot"));
        }
      }
    } catch (e) {}
    arr.push({ role: "bot", text: text });
    try { localStorage.setItem(LS_CHAT(nid), JSON.stringify(arr)); } catch (e) {}
    if (state.activeNotebook === nid) {
      state.messages = arr.slice();
      renderChat();
    }
  }

  try {
    const res = await api("POST", "/api/notebooks/" + nid + "/ask", { question: q });
    saveAnswer(res.answer || "(пустой ответ)");
  } catch (e) {
    if (e && e.isAuth) setStatus("err");
    saveAnswer(errorText(e));
  } finally {
    clearTimeout(askQuestion._timer);
    askQuestion._timer = null;
    $("btn-ask").disabled = false;
  }
}

async function loadSources() {
  if (!state.activeNotebook || state.sourcesBusy) return;
  state.sourcesBusy = true;
  try {
    const data = await api("GET", "/api/notebooks/" + state.activeNotebook + "/sources");
    state.sources = data.sources || [];
    renderSources();
    const hasProcessing = state.sources.some(s => {
      const st = String(s.status || "").toLowerCase();
      return st.includes("process") || st.includes("pending") || st.includes("queue") || st === "unknown" || st === "";
    });
    if (hasProcessing && !state.sourcesPollTimer) {
      state.sourcesPollTimer = setInterval(() => {
        if (!state.sourcesBusy) loadSources();
      }, 5000);
    } else if (!hasProcessing && state.sourcesPollTimer) {
      clearInterval(state.sourcesPollTimer);
      state.sourcesPollTimer = null;
    }
  } catch (e) {
    console.warn("loadSources error", e);
  } finally {
    state.sourcesBusy = false;
  }
}

function statusClass(status) {
  const s = String(status || "").toLowerCase();
  if (s.includes("ready") || s.includes("complete") || s === "done") return "s-ready";
  if (s.includes("process") || s.includes("pending") || s.includes("queue")) return "s-processing";
  if (s.includes("fail") || s.includes("error")) return "s-failed";
  return "s-unknown";
}

function renderSources() {
  const box = $("sources-list");
  $("sources-badge").textContent = state.sources.length;
  if (!state.activeNotebook) {
    box.innerHTML = '<div class="empty" style="padding:20px;">Сначала выбери блокнот</div>';
    return;
  }
  if (!state.sources.length) {
    box.innerHTML = '<div class="empty" style="padding:20px;">Пока нет источников<br>Добавь ссылки ниже</div>';
    return;
  }
  box.innerHTML = state.sources.map(s => `
    <div class="source-card">
      <div class="s-head">
        <div class="s-title">${escapeHtml(s.title || s.id || "—")}</div>
        <button class="s-del" data-sid="${escapeHtml(s.id)}" title="Удалить источник">✕</button>
      </div>
      <div class="s-meta">
        <span>${escapeHtml(s.kind || "")}</span>
        <span class="s-badge ${statusClass(s.status)}">${escapeHtml(s.status || "?")}</span>
      </div>
    </div>
  `).join("");
  box.querySelectorAll(".s-del").forEach(btn => {
    btn.addEventListener("click", () => deleteSource(btn.dataset.sid));
  });
}

async function addSources() {

async function deleteSource(sid) {
  if (!state.activeNotebook || !sid) return;
  const nid = state.activeNotebook;
  if (!confirm("Удалить этот источник?")) return;
  try {
    await api("DELETE", "/api/notebooks/" + nid + "/sources/" + encodeURIComponent(sid));
    toast("Источник удалён", "ok");
    loadSources();
  } catch (e) {
    toastError(e);
  }
}

  const raw = $("new-sources").value.trim();
  if (!raw) { toast("Вставь хотя бы одну ссылку", "err"); return; }
  if (!state.activeNotebook) { toast("Сначала выбери блокнот", "err"); return; }

  const urls = raw.split(/[\s,\n]+/).map(s => s.trim()).filter(s => s.startsWith("http"));
  if (!urls.length) { toast("Не нашёл ссылок", "err"); return; }

  const btn = $("btn-add-sources");
  btn.disabled = true;
  btn.textContent = "Добавляю " + urls.length + "…";
  toast("Отправлено " + urls.length + " ссылок — может занять минуту");

  try {
    const res = await api("POST", "/api/notebooks/" + state.activeNotebook + "/sources", { urls });
    const ok = (res.added || []).length;
    const err = (res.errors || []).length;
    if (err) {
      toast("Добавлено " + ok + ", ошибок " + err, "err");
    } else {
      toast("Добавлено " + ok, "ok");
      $("new-sources").value = "";
    }
    loadSources();
  } catch (e) {
    toastError(e);
  } finally {
    btn.disabled = false;
    btn.textContent = "Добавить";
  }
}

function openSheet(which) {
  document.getElementById("overlay-" + which).classList.add("open");
}
function closeSheet(which) {
  document.getElementById("overlay-" + which).classList.remove("open");
}

document.querySelectorAll(".overlay").forEach(ov => {
  ov.addEventListener("click", ev => {
    if (ev.target === ov) ov.classList.remove("open");
  });
});
document.querySelectorAll("[data-close]").forEach(btn => {
  btn.addEventListener("click", () => closeSheet(btn.dataset.close));
});

$("nb-pill").addEventListener("click", () => {
  renderNotebooksList();
  openSheet("nb");
});
$("chip-sources").addEventListener("click", () => {
  renderSources();
  openSheet("src");
});
$("chip-copy-all").addEventListener("click", copyAllChat);
$("btn-new-notebook").addEventListener("click", createNotebook);
$("btn-refresh-sources").addEventListener("click", () => loadSources());
$("btn-add-sources").addEventListener("click", addSources);
$("btn-ask").addEventListener("click", askQuestion);

$("question").addEventListener("input", e => {
  const t = e.target;
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 130) + "px";
});

(async function init() {
  await checkHealth();
  await loadNotebooks();
  let saved = null;
  try { saved = localStorage.getItem(LS_ACTIVE); } catch (e) {}
  if (saved && state.notebooks.find(n => n.id === saved)) {
    selectNotebook(saved);
  } else if (state.notebooks.length) {
    selectNotebook(state.notebooks[0].id);
  }
  setInterval(checkHealth, 60000);
})();
</script>
